<style>
  :root{
    --cream:#FFFBF3; --card:#FFFFFF; --ink:#2B1D12; --ink-soft:#7A6A58;
    --orange:#EA580C; --orange-dark:#C2410C; --yellow:#F59E0B; --red:#DC2626;
    --green:#15803D; --line:#F0E4D3; --shadow: 0 1px 2px rgba(43,29,18,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  h1,h2,h3,.display{font-family:'Poppins',sans-serif;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:14px;font-weight:600;font-size:15px;border:none;cursor:pointer;transition:transform .08s ease, box-shadow .15s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;box-shadow:0 6px 16px rgba(234,88,12,.28);}
  .btn-outline{background:#fff;color:var(--orange-dark);border:1.5px solid #F2D9BF;}
  .btn-ghost{background:transparent;color:var(--ink-soft);}
  .btn-danger{background:#FEE2E2;color:var(--red);}
  .btn-yellow{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#5A3600;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);}
  .input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid #ECD9C3;background:#fff;font-size:15px;font-family:'Inter',sans-serif;color:var(--ink);}
  .input:focus{outline:none;border-color:var(--orange);}
  .label{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;display:block;}
  .pill{display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;}
  .pill-ok{background:#DCFCE7;color:#166534;} .pill-warn{background:#FEF3C7;color:#92400E;}
  .pill-bad{background:#FEE2E2;color:#991B1B;} .pill-mute{background:#F1EEE8;color:#6B5D4D;}
  .navitem{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;color:#FFE8D2;font-weight:600;font-size:14.5px;cursor:pointer;}
  .navitem.active{background:rgba(255,255,255,.16);color:#fff;}
  .navitem:hover{background:rgba(255,255,255,.09);}
  .mobile-nav-bg{position:fixed;inset:0;background:rgba(43,29,18,0);z-index:80;display:none;transition:background .22s ease;}
  .mobile-nav-bg.open{display:block;background:rgba(43,29,18,.28);}
  .mobile-nav-drawer{position:fixed;top:62px;left:10px;width:236px;max-width:80vw;max-height:calc(100vh - 84px);overflow-y:auto;
    background:linear-gradient(165deg,rgba(197,69,16,.94),rgba(146,40,8,.94));backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px;display:flex;flex-direction:column;
    transform-origin:top left;transform:scale(.94) translateY(-6px);opacity:0;pointer-events:none;
    transition:transform .18s cubic-bezier(.32,.72,0,1),opacity .16s ease;box-shadow:0 20px 44px rgba(43,29,18,.35);}
  .mobile-nav-bg.open .mobile-nav-drawer{transform:scale(1) translateY(0);opacity:1;pointer-events:auto;}
  .mobile-nav-drawer .navitem{padding:10px 12px;font-size:14px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-size:11.5px;text-transform:none;color:var(--ink-soft);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap;}
  td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:hover td{background:#FFF8EF;}
  .sticky-col{position:sticky;left:0;background:var(--card);z-index:1;box-shadow:1px 0 0 var(--line);}
  tr:hover td.sticky-col{background:#FFF8EF;}
  th.sticky-col{z-index:2;}
  .modal-bg{position:fixed;inset:0;background:rgba(43,29,18,.45);display:flex;align-items:flex-end;justify-content:center;z-index:60;}
  @media(min-width:700px){.modal-bg{align-items:center;}}
  .modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:22px;}
  @media(min-width:700px){.modal{border-radius:20px;}}
  .toast{background:#2B1D12;color:#fff;padding:13px 18px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;}
  .spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  .spinner-dark{border:2.5px solid #F0DCC0;border-top-color:var(--orange);}
  @keyframes spin{to{transform:rotate(360deg);}}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#E7D2B4;border-radius:8px;}
  .statnum{font-family:'Poppins',sans-serif;font-weight:800;font-size:28px;}
  .ac-wrap{position:relative;}
  .ac-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid #ECD9C3;border-radius:12px;margin-top:4px;max-height:230px;overflow-y:auto;z-index:90;box-shadow:0 10px 28px rgba(43,29,18,.18);display:none;}
  .ac-item{padding:12px 14px;font-size:14.5px;cursor:pointer;border-bottom:1px solid #F5EBDC;}
  .ac-item:last-child{border-bottom:none;}
  .ac-item:hover,.ac-item.ac-active{background:#FFF3E4;}
  .ac-item-new{color:var(--orange-dark);font-weight:600;}
  .ac-empty{padding:12px 14px;font-size:13px;color:var(--ink-soft);}
  @media (max-width:640px){
    .modal{padding:18px;max-height:88vh;}
    table{font-size:12.5px;}
    th,td{padding:8px 8px;}
    .statnum{font-size:22px;}
  }
</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-5">
  <div class="w-full max-w-sm">
    <div class="text-center mb-7">
      <div style="width:80px;height:80px;border-radius:20px;margin:0 auto 16px;overflow:hidden;box-shadow:0 10px 24px rgba(234,88,12,.28);background:#fff;">
        <img src="https://res.cloudinary.com/dfjegeiip/image/upload/v1791224103/logo_n_qsftik.jpg" alt="P Food'z Cafe" style="width:100%;height:100%;object-fit:cover;">
      </div>
      <h1 style="font-size:22px;font-weight:800;margin:0;">P Food'z Cafe</h1>
      <p style="color:var(--ink-soft);font-size:13.5px;margin-top:4px;">Canteen &amp; Warehouse Operations</p>
    </div>
    <div class="card p-6">
      <label class="label">User ID</label>
      <input id="loginUser" class="input mb-4" placeholder="e.g. Aniket-001" autocomplete="username">
      <label class="label">Password</label>
      <input id="loginPass" type="password" class="input mb-2" placeholder="••••••" autocomplete="current-password">
      <div id="loginErr" class="text-sm mb-2" style="color:var(--red);display:none;"></div>
      <button class="btn btn-primary w-full mt-3" onclick="doLogin()" id="loginBtn">Log In</button>
    </div>
    <p class="text-center mt-5 text-xs" style="color:var(--ink-soft);">Data is stored directly in your Google Sheet — no separate database.</p>
  </div>
</div>

<!-- ======================= APP SHELL ======================= -->
<div id="appShell" style="display:none;">
  <div class="flex" style="min-height:100vh;">
    <!-- Main -->
    <div class="flex-1 min-w-0">
      <!-- Topbar -->
      <div class="flex items-center justify-between px-4 md:px-7 py-4" style="background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;">
        <div class="flex items-center gap-3">
          <button class="btn btn-ghost" style="padding:6px;" onclick="toggleMobileNav()">☰</button>
          <h2 id="pageTitle" style="font-weight:700;font-size:17px;margin:0;">Dashboard</h2>
        </div>
        <div class="flex items-center gap-2">
          <span id="netBadge" class="pill pill-ok">● Online</span>
          <span id="syncBadge" class="pill pill-mute" style="display:none;">🔄 Live</span>
          <span id="queueBadge" class="pill pill-warn" style="display:none;"></span>
        </div>
      </div>
      <!-- Mobile nav drawer -->
      <div id="mobileNavBg" class="mobile-nav-bg" onclick="if(event.target===this)toggleMobileNav(false)">
        <div id="mobileNavDrawer" class="mobile-nav-drawer">
          <div class="flex items-center justify-between mb-3" style="padding:2px 4px 0;">
            <div class="flex items-center gap-2">
              <div style="width:26px;height:26px;border-radius:8px;overflow:hidden;background:#fff;flex-shrink:0;"><img src="https://res.cloudinary.com/dfjegeiip/image/upload/v1791224103/logo_n_qsftik.jpg" alt="Logo" style="width:100%;height:100%;object-fit:cover;"></div>
              <div style="color:#fff;font-weight:800;font-size:13px;">P Food'z Cafe</div>
            </div>
            <button class="btn btn-ghost" style="color:#fff;padding:2px 6px;font-size:15px;line-height:1;" onclick="toggleMobileNav(false)">✕</button>
          </div>
          <div id="navListMobile" class="flex flex-col gap-1"></div>
          <div class="pt-3 mt-1" style="border-top:1px solid rgba(255,255,255,.15);padding:10px 4px 0;">
            <button id="installAppBtn" class="navitem" style="display:none;width:100%;background:rgba(255,255,255,.14);" onclick="installApp()">📲<span>Install App</span></button>
          </div>
          <div class="pt-3 mt-1" style="border-top:1px solid rgba(255,255,255,.15);padding:0 4px;">
            <div id="mobileSidebarUser" style="color:#fff;font-size:13px;font-weight:700;"></div>
            <div id="mobileSidebarRole" style="color:#FFD9B0;font-size:11.5px;"></div>
            <button class="btn btn-ghost text-xs mt-2" style="color:#FFE8D2;padding:6px 0;" onclick="logout()">↪ Log out</button>
          </div>
        </div>
      </div>

      <main class="p-4 md:p-7" id="mainContent"></main>
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toastWrap" style="position:fixed;bottom:20px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;pointer-events:none;"></div>

<!-- Confirm dialog -->
<div id="confirmBg" class="modal-bg" style="display:none;">
  <div class="modal" style="max-width:380px;">
    <h3 id="confirmTitle" style="font-size:16px;margin:0 0 8px;">Are you sure?</h3>
    <p id="confirmMsg" style="color:var(--ink-soft);font-size:14px;margin:0 0 18px;"></p>
    <div class="flex gap-3">
      <button class="btn btn-ghost flex-1" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger flex-1" id="confirmOkBtn">Confirm</button>
    </div>
  </div>
</div>

<!-- Generic modal mount point -->
<div id="modalMount"></div>

<!-- Full-screen punch IN/OUT success message -->
<div id="punchSuccessOverlay" style="display:none;position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;">
  <div id="punchSuccessIcon" style="font-size:64px;margin-bottom:16px;"></div>
  <div id="punchSuccessTitle" style="font-family:'Poppins',sans-serif;font-weight:800;font-size:28px;margin-bottom:8px;"></div>
  <div id="punchSuccessSub" style="font-size:15px;opacity:.9;"></div>
</div>

<script>
/* ================================================================
   CONFIG — paste your Apps Script Web App /exec URL here
   ================================================================ */
const CONFIG = {
  API_URL: localStorage.getItem('pfp_api_url') || "https://peetambra-backend.onrender.com",
};

// Product & Stock Master field names — must match Code.gs's PROD_COL exactly
// (this is the real sheet's header row, spacing/typos and all). "CURRENT" is
// a formula on the sheet (Opening + Purchase − Demand) — never write to it.
const PROD_FIELD = {
  CURRENT: 'Current Stock',                          // virtual: total in fine "Unit" terms (e.g. pcs)
  CURRENTCARTON: 'Current Stock In Carton',          // virtual: same total in bulk Base Unit terms
  DEMAND: 'Deman for canteen',                       // qty REQUESTED by cashier (native-unit running total)
  DEMANDUNIT: 'Demand Unit',                         // this item's saved default demand-entry unit
  APPROVED: 'Approved Demand Qty by supervisor',     // qty APPROVED by supervisor
  // Warehouse Stock Entry adds here — virtual total (Full Pack × conversion + Loose).
  OPENING: 'Warehouse Stock Qty Opening STock',
  // Reserved for goods received specifically through a Purchase Order
  // (Manual Purchase Entry) — kept separate from OPENING above.
  PURCHASE: 'Purchase Stock  QTy',
  MIN: 'Min',
  MAX: 'Max',
  RATE: 'Rate',
  RATEUNIT: 'Unit of rate',
  EXPIRY: 'Expiry Date',
  BASEUNIT: 'Base Unit',                             // bulk/pack unit (peti/pkt/box/vori…)
  STOCKUNITQTY: '1 Stock Unit = (Base Qty)',          // 1 Base Unit = this many native Units
  STOCKTYPE: 'Stock Type',                           // "Stocked" or "Daily-Market"
};

/* ================================================================
   STATE
   ================================================================ */
let STATE = {
  user: null,           // {userId,name,designation,shift,permission}
  page: 'dashboard',
  products: [],
  categories: [],
  demands: [],
  pos: [],
  staff: [],
  attendance: [],
  alerts: [],
  warehouseEntries: [],
  vendors: [],
  stats: null,
};

const NAV = {
  // SuperAdmin only needs staff IN/OUT hours & the ability to correct them —
  // every other section is intentionally hidden from this role.
  SuperAdmin: [
    ['attcontrol','🛠️','Staff Attendance & Timing'],

/* ================================================================
   API HELPER — uses text/plain to avoid CORS preflight on Apps Script
   ================================================================ */
// ---------------------------------------------------------------------
// SPEED LAYER
//  * Stale-while-revalidate: every read returns instantly from memory /
//    localStorage (0 ms) and refreshes silently in the background; the
//    screen re-draws itself only if the data really changed.
//  * Every write carries a request-id, so a retry after a network hiccup
//    can never post twice (the backend de-duplicates by that id).
//  * Automatic retries + generous timeouts: no "network error" for a blip.
// ---------------------------------------------------------------------
const SWR_ACTIONS = new Set(['getProducts','getDemands','getStaff','getVendors','getAttendance','getPOBatches','getDashboardStats','getLowStockAlerts','getCylinderPrice']);
const STALE_MS = 4000;             // older than this -> revalidate in background
const LS_CACHE_KEY = 'pfp_cache_v3';
const API_MEM = {};                // key -> { data, time }
const API_INFLIGHT = {};
let WRITE_EPOCH = 0;
let _persistTimer = null;
function ckey(action, payload) { return action + '|' + (payload && Object.keys(payload).length ? JSON.stringify(payload) : ''); }
function loadPersistedCache() {
  try { const o = JSON.parse(localStorage.getItem(LS_CACHE_KEY) || '{}'); Object.keys(o).forEach(k => { API_MEM[k] = o[k]; }); } catch (e) {}
}
function persistCacheSoon() {
  if (_persistTimer) return;
  _persistTimer = setTimeout(() => {
    _persistTimer = null;
    try {
      const o = {};
      Object.keys(API_MEM).forEach(k => { const s = JSON.stringify(API_MEM[k]); if (s.length < 600000) o[k] = API_MEM[k]; });
      localStorage.setItem(LS_CACHE_KEY, JSON.stringify(o));
    } catch (e) { try { localStorage.removeItem(LS_CACHE_KEY); } catch (_) {} }
  }, 400);
}
function clearApiCache() { Object.keys(API_MEM).forEach(k => delete API_MEM[k]); try { localStorage.removeItem(LS_CACHE_KEY); } catch (e) {} }
function markAllStale() { Object.keys(API_MEM).forEach(k => { API_MEM[k].time = 0; }); }
// kept for the existing call-sites: keeps the data (instant) but forces a background refresh
function invalidateApiCache(action) {
  Object.keys(API_MEM).forEach(k => { if (!action || k.split('|')[0] === action) API_MEM[k].time = 0; });
}
function isReadAction(action) { return /^get/.test(action) || action === 'poll' || action === 'login' || action === 'bootstrap'; }
function newRid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

async function rawCall(action, payload, opts) {
  if (!CONFIG.API_URL || CONFIG.API_URL.includes('PASTE_YOUR')) throw new Error('Backend not connected. Paste your Apps Script Web App URL into CONFIG.API_URL.');
  const read = isReadAction(action);
  const body = JSON.stringify(read ? { action, ...payload } : { action, ...payload, _rid: payload._rid || newRid() });
  const timeouts = read ? [15000, 25000, 40000] : [40000, 60000, 60000];
  let lastErr = null;
  for (let i = 0; i < timeouts.length; i++) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeouts[i]);
    try {
      const res = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, signal: controller.signal });
      let json;
      try { json = await res.json(); } catch (e) { throw Object.assign(new Error('Backend ne unexpected response diya.'), { retry: true }); }
      if (!json.ok) {
        const busy = /SERVER_BUSY|too many|Service invoked|try again/i.test(json.error || '');
        throw Object.assign(new Error((json.error || 'Request failed').replace(/^SERVER_BUSY:\s*/, '')), { retry: busy, server: true });
      }
      return json.data;
    } catch (e) {
      lastErr = e;
      const network = e.name === 'AbortError' || !e.server;
      if (!(network || e.retry) || i === timeouts.length - 1) break;
      await sleep(500 * (i + 1));
    } finally { clearTimeout(timer); }
  }
  if (lastErr && lastErr.name === 'AbortError') throw new Error('Server slow hai — dobara try karo (aapka data double save nahi hoga).');
  if (lastErr && !lastErr.server && !lastErr.retry) throw new Error('Network error — internet check karo aur dobara try karo.');
  throw lastErr || new Error('Request failed');
}
async function revalidate(action, payload, key) {
  if (API_INFLIGHT[key]) return API_INFLIGHT[key];
  const epoch = WRITE_EPOCH;
  API_INFLIGHT[key] = (async () => {
    try {
      const data = await rawCall(action, payload || {});
      if (epoch !== WRITE_EPOCH) return;               // a write happened meanwhile -> this answer may be stale, drop it
      const old = API_MEM[key];
      const changed = !old || JSON.stringify(old.data) !== JSON.stringify(data);
      API_MEM[key] = { data: changed ? data : old.data, time: Date.now() };
      persistCacheSoon();
      if (changed) onCacheRefreshed(action, data);
    } catch (e) { /* silent — cached data stays on screen */ }
    finally { delete API_INFLIGHT[key]; }
  })();
  return API_INFLIGHT[key];
}
async function api(action, payload, opts) {
  opts = opts || {}; payload = payload || {};
  if (SWR_ACTIONS.has(action) && !opts.skipCache) {
    const key = ckey(action, payload);
    const hit = API_MEM[key];
    if (hit) {                                          // 0 ms path
      if (Date.now() - hit.time > STALE_MS) revalidate(action, payload, key);
      return hit.data;
    }
    if (API_INFLIGHT[key]) { await API_INFLIGHT[key]; if (API_MEM[key]) return API_MEM[key].data; }
    const epoch = WRITE_EPOCH;
    const data = await rawCall(action, payload, opts);
    API_MEM[key] = { data, time: epoch === WRITE_EPOCH ? Date.now() : 0 };
    persistCacheSoon();
    return data;
  }
  const data = await rawCall(action, payload, opts);
  if (!isReadAction(action)) { WRITE_EPOCH++; markAllStale(); }
  return data;
}
// Called when a background refresh brought NEW data — redraw only what is safe to redraw.
const LIST_PAGES = new Set(['dashboard','stock','demand','po','staff']);
function userBusy() {
  const modalOpen = document.getElementById('modalMount').innerHTML.trim() !== '';
  const a = document.activeElement;
  const typed = Array.from(document.querySelectorAll('.dmApproveQty')).some(i => i.value !== i.defaultValue);
  return modalOpen || typed || (a && ['INPUT','SELECT','TEXTAREA'].includes(a.tagName));
}
function onCacheRefreshed(action, data) {
  if (!STATE.user) return;
  const pg = STATE.page;
  if (LIST_PAGES.has(pg)) { if (!userBusy()) rerenderCurrent(); return; }
  if (pg === 'demandEntry') {
    if (action === 'getDemands') { STATE.demands = data; renderDemandHistoryPanel(); }
    if (action === 'getProducts') { STATE.products = data; const el = document.getElementById('dmItemInput'); if (el) onDmItemInput(el.value); }
  } else if ((pg === 'stockEntry' || pg === 'manualPurchaseEntry') && action === 'getProducts') { STATE.products = data; }
}
loadPersistedCache();

/* ================================================================
   AUTOCOMPLETE — custom search-as-you-type dropdown. Native <datalist>
   is unreliable on mobile (iOS Safari barely renders it at all), so
   every "search existing / type new" field in this app uses this
   instead. Fully touch-friendly, works identically everywhere.
   ================================================================ */
function autocompleteField(id, placeholder, value) {
  return `<div class="ac-wrap">
    <input id="${id}" class="input" placeholder="${placeholder}" autocomplete="off"
      value="${(value||'').toString().replace(/"/g,'&quot;')}"
      oninput="acFilter('${id}')" onfocus="acFilter('${id}')">
    <div id="${id}_list" class="ac-list"></div>
  </div>`;
}
// options: array of strings. onSelect(value) fires when a suggestion is tapped.
// newLabel: if set, shows an "add as new" row when the typed text has no exact match.
function acInit(id, options, onSelect, newLabel) {
  window.__ac = window.__ac || {};
  window.__ac[id] = { options: options || [], onSelect: onSelect, newLabel: newLabel };
}
function acFilter(id) {
  const cfg = (window.__ac || {})[id];
  const input = document.getElementById(id);
  const list = document.getElementById(id + '_list');
  if (!cfg || !input || !list) return;
  const q = input.value.trim().toLowerCase();
  const matches = cfg.options.filter(o => o.toLowerCase().includes(q)).slice(0, 50);
  let html = matches.map(o => `<div class="ac-item" onmousedown="acPick('${id}', ${JSON.stringify(o).replace(/"/g,'&quot;')})">${o}</div>`).join('');
  const exact = cfg.options.some(o => o.toLowerCase() === q);
  if (cfg.newLabel && q && !exact) {
    html += `<div class="ac-item ac-item-new" onmousedown="acPick('${id}', ${JSON.stringify(input.value.trim()).replace(/"/g,'&quot;')})">➕ ${cfg.newLabel}: "${input.value.trim()}"</div>`;
  }
  // A field with no newLabel (e.g. the Demand/Stock/Purchase "Item" field)
  // handles "new item" entirely through its own meta text + inline fields
  // right below the input — showing this generic empty-dropdown message on
  // top of THAT would visually cover it (the dropdown floats above
  // everything below the input), making the real "🆕 naya item banega"
  // confirmation invisible. Just hide the dropdown instead of showing clutter
  // — but still fall through to the onSelect call below either way, or the
  // "new item" fields it's responsible for showing would never appear.
  const hideEmptyDropdown = !html && !cfg.newLabel;
  if (!html && cfg.newLabel) html = `<div class="ac-empty">No matches — keep typing to add new</div>`;
  if (hideEmptyDropdown) {
    list.style.display = 'none';
  } else {
    list.innerHTML = html;
    list.style.display = 'block';
  }
  // Keep the owning page reactive to live typing, not just an explicit
  // dropdown pick — without this, typing a name with zero suggestion
  // matches (e.g. a brand-new item) never notified the page at all.
  if (cfg.onSelect) cfg.onSelect(input.value);
}
function acPick(id, value) {
  const input = document.getElementById(id);
  const list = document.getElementById(id + '_list');
  input.value = value;
  list.style.display = 'none';
  const cfg = (window.__ac || {})[id];
  if (cfg && cfg.onSelect) cfg.onSelect(value);
}
document.addEventListener('click', (e) => {
  document.querySelectorAll('.ac-list').forEach(list => {
    if (!list.previousElementSibling || !list.parentElement.contains(e.target)) list.style.display = 'none';
  });
});

  else { badge.textContent = '● Offline'; badge.className = 'pill pill-bad'; }

function getQueue() { return JSON.parse(localStorage.getItem('pfp_queue') || '[]'); }
function setQueue(q) {
  localStorage.setItem('pfp_queue', JSON.stringify(q));
  const badge = document.getElementById('queueBadge');
  if (q.length) { badge.style.display='inline-flex'; badge.textContent = `⏳ ${q.length} pending sync`; }
  else badge.style.display = 'none';
}
async function syncQueue() {
  let q = getQueue();
  if (!q.length || !navigator.onLine) return;
  const t = toast('Syncing offline records…', 'loading');
  for (const item of [...q]) {
    try {
      if (!item._rid) { item._rid = newRid(); setQueue(q); }
      const action = item.__action || 'markAttendance';
      const { __action, ...payload } = item;
      await api(action, payload);
      q = q.filter(x => x !== item);
      setQueue(q);
    } catch (e) { break; }
  }
  t.remove();
  if (!q.length) toast('All offline records synced ✔');
}

   AUTH

async function doLogin() {
  const userId = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value.trim();
  const errEl = document.getElementById('loginErr');
  errEl.style.display = 'none';
  if (!userId || !password) { errEl.textContent = 'Enter both User ID and Password.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('loginBtn');
  btnSaving(btn, 'Logging in…');
  try {
    const user = await api('login', { userId, password });
    // The backend bundles this login's bootstrap data (products/demands/etc.)
    // into the SAME response — pull it out before persisting/storing the user
    // object (keep pfp_user small, matching its original shape) and hand it
    // to enterApp() so it can skip the normally-separate bootstrap round trip.
    const preloadedBootstrap = user.bootstrap; delete user.bootstrap;
    STATE.user = user;
    localStorage.setItem('pfp_user', JSON.stringify(user));
    enterApp(preloadedBootstrap);
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btnRestore(btn);
  }
}
function logout() {
  localStorage.removeItem('pfp_user');
  clearApiCache();
  STATE.user = null;
  if (AUTO_REFRESH_TIMER) { clearInterval(AUTO_REFRESH_TIMER); AUTO_REFRESH_TIMER = null; }
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

// preloadedBootstrap: when doLogin() already got bootstrap data bundled into
// the login response itself (the fast path — one network round trip instead
// of two), apply it directly instead of firing a second, now-redundant
// bootstrap call. The "already logged in from localStorage" path (app
// reopened with a saved session, no login round trip at all) has no such
// data, so it falls back to the normal separate bootstrapApp() call.
function enterApp(preloadedBootstrap) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'block';
  document.getElementById('mobileSidebarUser').textContent = STATE.user.name;
  document.getElementById('mobileSidebarRole').textContent = `${STATE.user.designation} · ${STATE.user.permission}`;
  buildNav();
  if (preloadedBootstrap) applyBootstrapResult(preloadedBootstrap);
  else bootstrapApp();
  goTo(STATE.user.permission === 'SuperAdmin' ? 'attcontrol' : 'dashboard');
  startAutoRefresh();
}
// One combined request right after login instead of 5-7 separate ones. It fills the
// same cache api() already uses, and registers itself as "in flight" so the first page
// waits for it instead of firing its own duplicate call. If it fails for any reason the
// old separate calls run exactly as before (nothing is lost).
const BOOTSTRAP_ACTION_OF = { products: 'getProducts', demands: 'getDemands', vendors: 'getVendors', stats: 'getDashboardStats', staff: 'getStaff' };
// myAttendance/allAttendance are both the SAME backend action (getAttendance)
// but with different payloads (own-user-only vs everyone) — handled
// separately from BOOTSTRAP_ACTION_OF since their cache key isn't just "{}".
function bootstrapCacheKey(w) {
  if (w === 'myAttendance') return ckey('getAttendance', { userId: STATE.user && STATE.user.userId });
  if (w === 'allAttendance') return ckey('getAttendance', {});
  return ckey(BOOTSTRAP_ACTION_OF[w], {});
}
// Drops a bootstrap-shaped result straight into the api() cache, exactly
// like bootstrapApp()'s own .then() used to do inline — pulled out so the
// login-bundled fast path (see doLogin) can reuse the identical population
// logic instead of duplicating it.
function applyBootstrapResult(r) {
  if (!r) return;
  Object.keys(BOOTSTRAP_ACTION_OF).forEach((w) => {
    if (r[w] === undefined) return;
    const key = bootstrapCacheKey(w);
    const old = API_MEM[key];
    const changed = !old || JSON.stringify(old.data) !== JSON.stringify(r[w]);
    API_MEM[key] = { data: changed ? r[w] : old.data, time: Date.now() };
    if (old && changed) onCacheRefreshed(BOOTSTRAP_ACTION_OF[w], r[w]);
  });
  ['myAttendance', 'allAttendance'].forEach((w) => {
    if (r[w] === undefined) return;
    const key = bootstrapCacheKey(w);
    const old = API_MEM[key];
    const changed = !old || JSON.stringify(old.data) !== JSON.stringify(r[w]);
    API_MEM[key] = { data: changed ? r[w] : old.data, time: Date.now() };
    if (old && changed) onCacheRefreshed('getAttendance', r[w]);
  });
  persistCacheSoon();
  if (r.poll) applyPollBaseline(r.poll);
}
// Tailored per role to EXACTLY what that role's first page (and its one or
// two likely-next pages) actually reads — never a generic one-size-fits-all
// list, so no role waits on a sheet-read it doesn't need. Mirrors login()'s
// role→want mapping on the backend (see Code.gs) — kept in sync by hand
// since the two sides can't literally share code.
function bootstrapApp() {
  const p = STATE.user.permission;
  const want = [];
  if (p === 'SuperAdmin') {
    want.push('staff', 'allAttendance');
  } else {
    want.push('myAttendance');
    if (p === 'Admin') want.push('stats', 'products', 'demands');
    else if (p === 'Supervisor') want.push('demands', 'products', 'vendors');
    else if (p === 'Cashier') want.push('products', 'demands');
  }
  const epoch = WRITE_EPOCH;
  const call = rawCall('bootstrap', { want, userId: STATE.user.userId });
  const done = call.then((r) => {
    if (epoch === WRITE_EPOCH) applyBootstrapResult(r);
  }).catch(() => { prefetchAll(); pollTick(true); });   // fallback = the old behaviour
  // only block the first page on keys we do not already have from the last visit (cache = 0 ms)
  want.forEach((w) => {
    const key = bootstrapCacheKey(w);
    if (!API_MEM[key] && !API_INFLIGHT[key]) { API_INFLIGHT[key] = done; done.then(() => { if (API_INFLIGHT[key] === done) delete API_INFLIGHT[key]; }); }
  });
}
function applyPollBaseline(r) {
  LAST_VER = r.ver;
  if (STATE.user && STATE.user.permission === 'Supervisor') { setDemandNavBadge(r.pending); LAST_PENDING_DEMAND_COUNT = r.pending; }
  const badge = document.getElementById('syncBadge');
  if (badge) { badge.style.display = 'inline-flex'; badge.textContent = '🔄 Synced ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
}
function prefetchAll() {
  const p = STATE.user.permission;
  api('getProducts', {}).catch(() => {});
  if (p === 'Supervisor' || p === 'Cashier' || p === 'Admin') api('getDemands', {}).catch(() => {});
  if (p === 'Supervisor') { api('getVendors', {}).catch(() => {}); api('getPOBatches', {}).catch(() => {}); }
}

/* ================================================================
   LIVE AUTO-REFRESH — keeps the screen in sync with the Google Sheet
   (e.g. someone else editing the sheet directly, or another device
   marking attendance / raising a demand) without needing a manual reload.
   ================================================================ */
let AUTO_REFRESH_TIMER = null;
let _autoRefreshBound = false;
function startAutoRefresh() {
  if (AUTO_REFRESH_TIMER) clearInterval(AUTO_REFRESH_TIMER);
  // Supervisor needs the new-demand alert quickly (20s); everyone else is fine at 30s -> less server load.
  const ms = STATE.user && STATE.user.permission === 'Supervisor' ? 20000 : 30000;
  AUTO_REFRESH_TIMER = setInterval(() => { if (!document.hidden) pollTick(false); }, ms);
  if (_autoRefreshBound) return;                 // listeners were being added again on every login
  _autoRefreshBound = true;
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pollTick(false); });
  window.addEventListener('focus', () => pollTick(false));
}
// ONE tiny request every 20s replaces the old heavy re-download of whole sheets.
// It returns a "version" number — the full data is re-fetched only when it changed —
// plus the pending-demand count for the Supervisor badge / new-demand toast.
let LAST_PENDING_DEMAND_COUNT = null;
let LAST_VER = null;
let POLL_BUSY = false;
let LAST_POLL_AT = 0;
async function pollTick(baseline) {
  if (!STATE.user || POLL_BUSY || !navigator.onLine) return;
  if (!baseline && document.hidden) return;
  if (!baseline && Date.now() - LAST_POLL_AT < 4000) return;   // focus + visibilitychange fire together
  LAST_POLL_AT = Date.now();
  POLL_BUSY = true;
  try {
    const r = await api('poll', {}, { skipCache: true });
    if (STATE.user.permission === 'Supervisor') {
      setDemandNavBadge(r.pending);
      if (LAST_PENDING_DEMAND_COUNT !== null && r.pending > LAST_PENDING_DEMAND_COUNT && r.newest) {
        toast(`🔔 Nayi demand aayi — ${r.newest.item} (${r.newest.qty} ${r.newest.unit}) by ${r.newest.by}`);
      }
      LAST_PENDING_DEMAND_COUNT = r.pending;
    }
    if (LAST_VER !== null && r.ver !== LAST_VER) {
      markAllStale();
      if (LIST_PAGES.has(STATE.page)) { if (!userBusy()) { LAST_VER = r.ver; rerenderCurrent(); } /* else retry next tick */ }
      else { LAST_VER = r.ver; if (STATE.page === 'demandEntry') { api('getDemands', {}); api('getProducts', {}); } }
    } else { LAST_VER = r.ver; }
    const badge = document.getElementById('syncBadge');
    if (badge) { badge.style.display = 'inline-flex'; badge.textContent = '🔄 Synced ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
  } catch (e) { /* silent — the network badge already shows connectivity */ }
  finally { POLL_BUSY = false; }
}
function setDemandNavBadge(count) {
  document.querySelectorAll('.navitem[data-navkey="demand"] .navbadge').forEach(el => el.remove());
  if (!count) return;
  document.querySelectorAll('.navitem[data-navkey="demand"]').forEach(el => {
    const b = document.createElement('span');
    b.className = 'navbadge';
    b.textContent = count;
    b.style.cssText = 'background:var(--red);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;padding:1px 6.5px;margin-left:auto;';
    el.appendChild(b);
  });
}

function buildNav() {
  const items = NAV[STATE.user.permission] || NAV.User;
  const parentOf = { stockEntry: 'stock', demandEntry: 'demand', manualPurchaseEntry: 'po' };
  const activeKey = parentOf[STATE.page] || STATE.page;
  document.getElementById('navListMobile').innerHTML = items.map(([key,icon,label]) =>

  if (STATE.user.permission === 'Supervisor' && LAST_PENDING_DEMAND_COUNT) setDemandNavBadge(LAST_PENDING_DEMAND_COUNT);

function toggleMobileNav(force) {
  const bg = document.getElementById('mobileNavBg');
  const open = force !== undefined ? force : !bg.classList.contains('open');
  if (open) {
    bg.style.display = 'block';
    requestAnimationFrame(() => bg.classList.add('open'));
    document.body.style.overflow = 'hidden';
    updateInstallButtonVisibility();
  } else {

    setTimeout(() => { if (!bg.classList.contains('open')) bg.style.display = 'none'; }, 280);
  }
}

/* ================================================================
   ROUTER — every render function guards its final DOM write with
   "if (STATE.page !== 'x') return", so a slow request that resolves
   AFTER the user already navigated elsewhere can never overwrite the
   screen with stale data from a page they've left (this fixes the
   "wrong section showing" bug on slow connections).
   ================================================================ */
async function goTo(page) {
  STATE.page = page;
  toggleMobileNav(false);
  buildNav();
  const isManager = STATE.user.permission==='Admin' || STATE.user.permission==='SuperAdmin';
  const titles = {dashboard:'Dashboard',attendance:'Attendance',stock:'Stock & Products',stockEntry:'Warehouse Stock Entry',demand:'Canteen Demand',demandEntry:'Raise Canteen Demand',po:'Purchase Orders',manualPurchaseEntry:'Manual Purchase Entry',staff:'Staff Admin',reports:'Staff Hours & Reports',cylinder: isManager ? 'Cylinder Report' : 'Cylinder Entry',attcontrol:'Staff Attendance & Timing'};
  document.getElementById('pageTitle').textContent = titles[page] || '';
  const main = document.getElementById('mainContent');
  main.innerHTML = `<div class="flex justify-center py-20"><div class="spinner spinner-dark" style="width:26px;height:26px;"></div></div>`;
  try {
    if (page === 'reports') { REPORT_RANGE = { mode: 'today', from: null, to: null }; REPORT_STAFF = 'all'; }
    await renderPage(page);
  } catch (e) {
    if (STATE.page === page) main.innerHTML = errorBlock(e.message, () => goTo(page));
  }
}
async function renderPage(page) {
  if (page === 'dashboard') await renderDashboard();
  else if (page === 'attendance') await renderAttendance();
  else if (page === 'stock') await renderStock();
  else if (page === 'stockEntry') await renderStockEntry();
  else if (page === 'demand') await renderDemand();
  else if (page === 'demandEntry') await renderDemandEntry();
  else if (page === 'po') await renderPO();
  else if (page === 'manualPurchaseEntry') await renderManualPurchaseEntry();
  else if (page === 'staff') await renderStaff();
  else if (page === 'reports') await renderReports();
  else if (page === 'cylinder') await renderCylinder();
  else if (page === 'attcontrol') await renderAttendanceControl();
}
// Redraw the current list page from (fresh) cache — no spinner, no flicker.
async function rerenderCurrent() {
  const page = STATE.page;
  if (!LIST_PAGES.has(page)) return;
  const scroller = document.scrollingElement; const y = scroller ? scroller.scrollTop : 0;
  try { await renderPage(page); if (scroller && STATE.page === page) scroller.scrollTop = y; } catch (e) {}
}
function errorBlock(msg, retry) {
  return `<div class="card p-6 text-center max-w-md mx-auto mt-10">
    <div style="font-size:30px;">⚠️</div>
    <p style="color:var(--ink-soft);margin:10px 0 16px;font-size:14px;">${msg}</p>
    <button class="btn btn-outline" onclick="(${retry.toString()})()">↻ Retry</button>
  </div>`;
}

// Drive "view" URLs (…/file/d/FILE_ID/view) are viewer pages, not raw images —
// they 404/blank out as an <img src>. Rewrite to Drive's thumbnail endpoint,
// which serves an actual embeddable image for the same file.
function driveThumbSrc(url) {
  const m = String(url).match(/\/d\/([a-zA-Z0-9_-]+)/) || String(url).match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w200` : url;
}
// Medium inline thumbnail preview for a Drive photo URL — tap to open full size.
function photoThumb(url) {
  if (!url || !String(url).startsWith('http')) return '<span style="color:var(--ink-soft);font-size:12px;">—</span>';
  return `<a href="${url}" target="_blank"><img src="${driveThumbSrc(url)}" alt="photo" loading="lazy" style="width:56px;height:56px;object-fit:cover;border-radius:10px;border:1.5px solid var(--line);"></a>`;
}
function statCard(label, value, sub, icon) {

/* ================================================================
   ATTENDANCE — live camera + GPS, IN/OUT punches, offline queue fallback
   Shift Timing is shown only as a reference next to the button — actual
   worked hours always come from (OUT time − IN time), whatever those are.
   ================================================================ */
let cameraStream = null;
let ATT_NEXT_TYPE = 'IN';

// Backend now sends one row per staff member PER DAY, with IN and OUT
// already side by side. This just reshapes each row into the "session"
// object the rest of the UI (dashboard, reports, CSV export) expects.
// A photo URL field that doesn't start with "http" is a SuperAdmin correction
// note ("Manually corrected by X") rather than a real photo — the backend
// writes that note there since a manual correction has no live photo.
function isModifiedNote(val) {
  return val && !String(val).startsWith('http') ? String(val) : null;
}
function pairAttendance(rows) {
  return rows.map(r => {
    const inTime = r['IN Time'] ? new Date(r['IN Time']) : null;
    const outTime = r['OUT Time'] ? new Date(r['OUT Time']) : null;
    let hours = 0, complete = false;
    if (inTime && outTime && outTime > inTime) { hours = (outTime - inTime) / 3600000; complete = true; }
    return {
      userId: r['User ID'], name: r['Name'], designation: r['Designation'], shift: r['Shift'],
      dateObj: new Date(r['Date']),
      inTime, outTime, inStatus: r['IN Status'] || null, outStatus: r['OUT Status'] || null,
      inPhoto: r['IN Photo URL'] || '', outPhoto: r['OUT Photo URL'] || '',
      inMapsLink: r['IN Maps Link'] || '', outMapsLink: r['OUT Maps Link'] || '',
      inModifiedNote: isModifiedNote(r['IN Photo URL']), outModifiedNote: isModifiedNote(r['OUT Photo URL']),
      hours: Math.round(hours * 10) / 10, complete,
      dayStatus: r['Day Status'] || null, // "Leave" once the daily 3 AM auto-mark closes out a missed punch-out
    };
  }).sort((a, b) => b.dateObj - a.dateObj || (b.inTime || 0) - (a.inTime || 0));
}
// A day auto-marked Leave (IN punched, OUT never followed by the 3 AM
// cutoff) needs to be visibly distinct — shown as its own red pill,
// separate from the normal IN-status (Late/On Time) pill.
function dayStatusBadge(dayStatus) {
  return dayStatus === 'Leave' ? ' <span class="pill" style="background:#fee2e2;color:#b91c1c;">Leave (no OUT)</span>' : '';
}
// The Leave policy starts fresh from this date — must match Code.gs's
// LEAVE_POLICY_START exactly, so a Reports query spanning back before this
// date doesn't fabricate Leave days for a rule that didn't exist yet.
const LEAVE_POLICY_START = '2026-10-01';
// Fills every calendar day in [from, to] that has NO real attendance row at
// all with a synthetic "Leave" entry — a day nobody marked attendance on
// counts as Leave, same as a day where IN was punched but OUT never
// followed (that case is already flagged server-side by the daily 3 AM
// job). Never synthesizes today, future dates, or anything before
// LEAVE_POLICY_START. Real rows are always kept as-is, never duplicated or
// overwritten.
function fillLeaveDays(sessions, from, to, staffMeta) {
  const byDateKey = {};
  sessions.forEach(s => { byDateKey[localDateKey(s.dateObj)] = s; });
  const result = [];
  const cursor = new Date(from); cursor.setHours(0,0,0,0);
  const end = new Date(to); end.setHours(0,0,0,0);
  const todayKey = todayISO();
  while (cursor <= end) {
    const key = localDateKey(cursor);
    if (byDateKey[key]) {
      result.push(byDateKey[key]);
    } else if (key < todayKey && key >= LEAVE_POLICY_START) {
      result.push({
        userId: staffMeta.userId, name: staffMeta.name, designation: staffMeta.designation, shift: staffMeta.shift,
        dateObj: new Date(cursor), inTime: null, outTime: null, inStatus: null, outStatus: null,
        inPhoto: '', outPhoto: '', inModifiedNote: false, outModifiedNote: false,
        hours: 0, complete: false, dayStatus: 'Leave', synthetic: true,
      });
    }
    cursor.setDate(cursor.getDate() + 1);
  }
  return result.sort((a, b) => b.dateObj - a.dateObj);
}

async function startCamera(facingMode) {
  facingMode = facingMode || 'user';
  const video = document.getElementById('camVideo'), preview = document.getElementById('camPreview'),
        errEl = document.getElementById('camError'), captureBtn = document.getElementById('captureBtn'),
        retakeBtn = document.getElementById('retakeBtn'), retryBtn = document.getElementById('retryCamBtn'),
        submitBtn = document.getElementById('submitAttBtn');
  if (!video) return;
  preview.style.display = 'none';
  video.style.display = 'block';
  errEl.style.display = 'none';
  captureBtn.style.display = 'inline-flex';
  retakeBtn.style.display = 'none';
  retryBtn.style.display = 'none';
  if (submitBtn) submitBtn.style.display = 'none';
  window.capturedPhoto = null;
  try {
    if (cameraStream) cameraStream.getTracks().forEach(t=>t.stop());
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode }, audio: false });
    video.srcObject = cameraStream;
  } catch (e) {
    video.style.display = 'none';
    errEl.style.display = 'flex';
    errEl.innerHTML = `<span style="font-size:26px;">🚫</span><span>Camera access denied or unavailable.<br>Please allow camera permission in your browser, then tap Retry Camera.</span>`;
    captureBtn.style.display = 'none';
    retryBtn.style.display = 'inline-flex';
  }
}
function capturePhoto() {
  const video = document.getElementById('camVideo');
  const canvas = document.getElementById('camCanvas');
  const submitBtn = document.getElementById('submitAttBtn');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
  window.capturedPhoto = dataUrl;
  document.getElementById('camPreview').src = dataUrl;
  document.getElementById('camPreview').style.display = 'block';
  video.style.display = 'none';
  document.getElementById('captureBtn').style.display = 'none';
  document.getElementById('retakeBtn').style.display = 'inline-flex';
  if (submitBtn) submitBtn.style.display = 'block';
  if (cameraStream) cameraStream.getTracks().forEach(t=>t.stop());
}
let GPS = { lat:null, lng:null, pending:false };
function fetchGPS() {
  const status = document.getElementById('gpsStatus');
  GPS.pending = true;
  if (!navigator.geolocation) { GPS.pending = false; if (status) status.textContent = '📍 Location not supported on this device.'; return; }
  navigator.geolocation.getCurrentPosition(pos => {
    GPS.lat = pos.coords.latitude; GPS.lng = pos.coords.longitude; GPS.pending = false;
    const s = document.getElementById('gpsStatus'); if (s) s.textContent = `📍 Location captured (±${Math.round(pos.coords.accuracy)}m)`;
  }, err => {
    GPS.pending = false;
    const s = document.getElementById('gpsStatus'); if (s) s.textContent = '📍 Could not get location — ' + err.message;
  }, { enableHighAccuracy:true, timeout:10000 });
}
// If a punch is submitted right after opening the camera, GPS may still be
// resolving — wait briefly so the Maps link actually gets attached instead of
// silently going out blank. Never blocks the punch itself beyond this cap.
async function waitForGPSReady(maxWaitMs) {
  const start = Date.now();
  while (GPS.pending && (Date.now() - start) < maxWaitMs) {
    await new Promise(r => setTimeout(r, 200));
  }
}
async function submitAttendance() {
  if (!window.capturedPhoto) { toast('Please capture a photo first', 'error'); return; }
  const submitBtn = document.getElementById('submitAttBtn');
  btnSaving(submitBtn, 'Saving…');
  await waitForGPSReady(6000);
  const payload = {
    userId: STATE.user.userId, name: STATE.user.name, designation: STATE.user.designation,
    shift: STATE.user.shift, type: ATT_NEXT_TYPE, photoBase64: window.capturedPhoto, lat: GPS.lat, lng: GPS.lng,
  };
  try {
    if (!navigator.onLine) throw new Error('offline');
    const r = await api('markAttendance', payload);
    if (cameraStream) cameraStream.getTracks().forEach(t=>t.stop());
    showPunchSuccess(r.type, r.status);
    return;
  } catch (e) {
    if (e.message === 'offline') {
      const q = getQueue(); q.push({ ...payload, __action: 'markAttendance' }); setQueue(q);
      toast('No connection — saved offline, will auto-sync ⏳', 'error');
      startCamera(CAM_FACING);
    } else {
      toast(e.message, 'error');
    }
  } finally {
    submitBtn.textContent = ATT_NEXT_TYPE==='IN' ? '✅ Punch IN Now' : '✅ Punch OUT Now';
    submitBtn.disabled = false;
  }
}

function distinctFieldValues(field, defaults) {
  const set = {};
  (defaults||[]).forEach(v => set[v] = true);
  (STATE.products||[]).forEach(p => { if (p[field]) set[String(p[field]).trim()] = true; });
  return Object.keys(set).sort();

// Sort state for the Stock & Products table — 'col' matches the keys used
// in getSortedStockProducts() below, null means natural (sheet) order.
// Persists across re-renders within the session so re-opening the page
// keeps whatever sort you last picked.
let STOCK_SORT = { col: null, dir: 'desc' };
let STOCK_CAN_WRITE = false, STOCK_HAS_MINMAX = false;
async function renderStock() {
  // Categories are fully derivable from products (getCategories() on the
  // backend literally re-reads the whole Product sheet just to extract
  // this) — deriving it client-side here cuts a full redundant sheet-read
  // AND network round trip on every load of this page.
  const products = await api('getProducts',{});
  if (STATE.page !== 'stock') return;
  STATE.products = products; STATE.categories = distinctFieldValues('Category');
  // Only Supervisor gets entry actions — Admin sees this as a read-only report.
  STOCK_CAN_WRITE = STATE.user.permission === 'Supervisor';
  STOCK_HAS_MINMAX = products.length && (PROD_FIELD.MIN in products[0] || PROD_FIELD.MAX in products[0]);
  renderStockShell();
  refreshStockTable();
}
// Clickable header — click toggles High→Low / Low→High for that column;
// clicking a different column switches to it, starting High→Low (so
// "which items actually have stock" surfaces immediately, matching what

}
function sortStockTable(col) {
  if (STOCK_SORT.col === col) STOCK_SORT.dir = STOCK_SORT.dir === 'desc' ? 'asc' : 'desc';
  else { STOCK_SORT.col = col; STOCK_SORT.dir = 'desc'; }
  // Header arrows need updating too, not just the rows — this only rebuilds

}

function getSortedStockProducts() {
  const colMap = { demand: PROD_FIELD.DEMAND, approved: PROD_FIELD.APPROVED, opening: PROD_FIELD.OPENING, purchase: PROD_FIELD.PURCHASE, current: PROD_FIELD.CURRENT, rate: PROD_FIELD.RATE };
  // This table is "Current Stock" — only Stocked items have a real warehouse
  // stock to show here. Daily-Market items get their own section below.
  let list = STATE.products.filter(p => !isDailyMarketType(p[PROD_FIELD.STOCKTYPE] || 'Stocked'));
  if (STOCK_SORT.col === 'expiry') {
    list.sort((a, b) => {
      const av = a[PROD_FIELD.EXPIRY] ? new Date(a[PROD_FIELD.EXPIRY]).getTime() : 0;
      const bv = b[PROD_FIELD.EXPIRY] ? new Date(b[PROD_FIELD.EXPIRY]).getTime() : 0;
      return STOCK_SORT.dir === 'desc' ? bv - av : av - bv;
    });
  } else if (STOCK_SORT.col) {
    const field = colMap[STOCK_SORT.col];
    list.sort((a, b) => {
      const av = Number(a[field]) || 0, bv = Number(b[field]) || 0;
      return STOCK_SORT.dir === 'desc' ? bv - av : av - bv;
    });
  }
  return list;
}
// Daily-Market items have no warehouse stock concept — Current Stock is
// never deducted for them (see demandRowHtml/approveOne), so the only
// meaningful number to show is the "Deman for canteen" running total,
// which for these items is exactly "total qty ever requested, all-time".
function getDailyMarketProducts() {
  return STATE.products
    .filter(p => isDailyMarketType(p[PROD_FIELD.STOCKTYPE] || 'Stocked'))
    .sort((a, b) => (Number(b[PROD_FIELD.DEMAND]) || 0) - (Number(a[PROD_FIELD.DEMAND]) || 0));
}
function dailyMarketRowHtml(p) {
  return `<tr data-name="${(p['Item Name (Standardized)']||'').toLowerCase()}">
    <td class="sticky-col" style="font-weight:600;">${p['Item Name (Standardized)']}</td>
    <td>${p['Category']}</td>
    <td>${p['Unit']}</td>

}
// Re-applies the current search + sort against already-fetched
// STATE.products entirely client-side — instant, no network round trip.
function refreshStockTable() {
  const q = (document.getElementById('stockSearchInput') || {}).value || '';
  const qLower = q.toLowerCase();
  const body = document.getElementById('stockTableBody');
  if (body) {
    const colspan = 11 + (STOCK_HAS_MINMAX ? 1 : 0) + (STOCK_CAN_WRITE ? 1 : 0);
    const sorted = getSortedStockProducts().filter(p => (p['Item Name (Standardized)']||'').toLowerCase().includes(qLower));
    body.innerHTML = sorted.length ? sorted.map(p => stockRow(p, STOCK_CAN_WRITE, STOCK_HAS_MINMAX)).join('')
      : `<tr><td colspan="${colspan}" style="text-align:center;color:var(--ink-soft);padding:20px;">Koi Stocked item nahi mila.</td></tr>`;
  }
  const dmBody = document.getElementById('dailyMarketTableBody');
  if (dmBody) {
    const dm = getDailyMarketProducts().filter(p => (p['Item Name (Standardized)']||'').toLowerCase().includes(qLower));
    dmBody.innerHTML = dm.length ? dm.map(p => dailyMarketRowHtml(p)).join('')
      : `<tr><td colspan="4" style="text-align:center;color:var(--ink-soft);padding:20px;">Koi Daily-Market item nahi mila.</td></tr>`;
  }
}

function stockRow(p, canWrite, hasMinMax) {
  // Min/Max are entered in carton/Base-Unit terms on the real sheet (e.g.
  // Min 1.5 = "1.5 packs") — compare against CURRENTCARTON, not the
  // native/pcs CURRENT, or this would almost never flag a pack-based item
  // as low even when it genuinely is.
  const min = Number(p[PROD_FIELD.MIN])||0, max = Number(p[PROD_FIELD.MAX])||0, cur = Number(p[PROD_FIELD.CURRENTCARTON])||0;
  let statusPill = '';
  if (min>0 && cur<=min) statusPill = `<span class="pill pill-bad" style="margin-left:6px;">LOW</span>`;
  else if (max>0 && cur>=max) statusPill = `<span class="pill pill-warn" style="margin-left:6px;">OVER</span>`;
  // Expiry highlight — ONLY a genuinely expired date (before today) gets the
  // red badge. Everything else shows in normal/plain style, no matter how
  // close the date is. Date is shown as "27-Apr-2026" (day-month-year) — the
  // sheet's own "Apr-27" display drops the year, which reads exactly like a
  // month/short-year combo (e.g. "Jun-28" misread as "June 2028") and was
  // causing real confusion about which dates were actually in the past.
  // Keeping the year makes it unambiguous while still matching the sheet's
  // month-name style. A non-date value (e.g. "NA") must never be parsed as
  // a real Date — it would otherwise show the literal text "Invalid Date"
  // and could even look "expired" by accident.
  const expiryRaw = p[PROD_FIELD.EXPIRY];
  const expiryDate = expiryRaw ? new Date(expiryRaw) : null;
  const hasValidExpiry = expiryDate && !isNaN(expiryDate.getTime());
  let expiryStyle = 'font-size:12.5px;';
  let expiryText = '—';
  if (hasValidExpiry) {
    expiryText = expiryDate.getDate() + '-' + expiryDate.toLocaleDateString('en-US', { month: 'short' }) + '-' + expiryDate.getFullYear();
    const todayKey = new Date(); todayKey.setHours(0,0,0,0);
    const expKey = new Date(expiryDate); expKey.setHours(0,0,0,0);
    const daysLeft = Math.round((expKey - todayKey) / 86400000);
    if (daysLeft < 0) {
      expiryStyle += 'background:rgba(220,38,38,.2);color:var(--red);font-weight:700;border-radius:6px;padding:4px 8px;white-space:nowrap;';
      expiryText += ' (Expired)';
    } else {
      expiryStyle += 'color:var(--ink);white-space:nowrap;';
    }
  }
  return `<tr data-name="${(p['Item Name (Standardized)']||'').toLowerCase()}">
    <td class="sticky-col" style="font-weight:600;">${p['Item Name (Standardized)']}${statusPill}</td>
    <td>${p['Category']}</td>
    <td>${p['Unit']}</td>
    ${hasMinMax ? `<td style="color:var(--ink-soft);font-size:12.5px;">${min||'—'} / ${max||'—'}</td>` : ''}
    <td>${p[PROD_FIELD.DEMAND]||0}</td>
    <td>${p[PROD_FIELD.APPROVED]||0}</td>
    <td>${p[PROD_FIELD.OPENING]||0}</td>
    <td>${p[PROD_FIELD.PURCHASE]||0}</td>
    <td style="font-size:12px;color:var(--ink-soft);">${p['Vendor']||'—'}</td>
    <td>${p[PROD_FIELD.RATE] ? '₹'+p[PROD_FIELD.RATE] : '—'}</td>
    <td style="${expiryStyle}">${expiryText}</td>
    <td style="font-weight:700;color:var(--orange-dark);">${Number(p[PROD_FIELD.CURRENT])||0} pcs<div style="font-size:11px;color:var(--ink-soft);font-weight:500;">${cur} ctn</div></td>
    ${canWrite ? `<td><button class="btn btn-outline" style="padding:6px 12px;font-size:13px;" onclick='goToStockEntry(${JSON.stringify(p["Item Name (Standardized)"])})'>✎ Entry</button></td>` : ''}
  </tr>`;
}

let STOCK_ENTRY_PREFILL = '';

async function renderStockEntry() {
  // getVendors is a newer action — if the backend hasn't been redeployed
  // with it yet, the whole entry page (the most-used page in the app)
  // must not go down for it. Fails soft to an empty vendor list instead of
  // letting Promise.all's all-or-nothing rejection break everything else.
  // Categories are derived client-side from products (see renderStock) —
  // one less redundant sheet-read + round trip.

// Rate history is derived client-side from the warehouse entries already
// fetched for the "Recent Entries" panel — no extra network round trip.
// Shows the item's current stored rate plus its last few logged rates so
// the person entering stock can see the trend before typing today's rate.
function renderRateHistory(itemName, currentRate) {
  const past = (STATE.warehouseEntries || [])
    .filter(e => e['Item Name'] === itemName && Number(e['Rate']) > 0)
    .sort((a, b) => new Date(b['Timestamp']) - new Date(a['Timestamp']))
    .slice(0, 5);
  const parts = [];
  if (currentRate) parts.push(`<b>Current rate: ₹${currentRate}</b>`);
  if (past.length) {
    parts.push('Old rates: ' + past.map(e => `₹${e['Rate']} (${new Date(e['Timestamp']).toLocaleDateString()})`).join(', '));
  }
  return parts.length ? parts.join(' — ') : '';
}
function onWhItemInput(val) {
  val = val !== undefined ? val : document.getElementById('whItemInput').value;
  const match = findProductByName(val);
  const meta = document.getElementById('whItemMeta');
  const newOnly = document.getElementById('whNewOnlyFields');
  const saveBtn = document.getElementById('whSaveBtn');
  const catEl = document.getElementById('whCategory'), unitEl = document.getElementById('whUnit'), packEl = document.getElementById('whPack');
  const vendorEl = document.getElementById('whVendor');
  const rateHistEl = document.getElementById('whRateHistory');
  if (saveBtn) saveBtn.disabled = false;
  // Daily-Market items (bought fresh day to day) are never warehouse-tracked
  // — Supervisor's Warehouse Stock Entry is only for finite "Stocked"
  // inventory, so block it here rather than silently adding stock that
  // nothing will ever deduct against.
  if (match && isDailyMarketType(match[PROD_FIELD.STOCKTYPE] || 'Stocked')) {
    meta.innerHTML = `⚠️ "${match['Item Name (Standardized)']}" Daily-Market item hai — ismein Warehouse Stock Entry nahi ho sakti (roz mandi se aata hai, Cashier ki demand ke through hi track hota hai).`;
    catEl.value = match['Category'] || ''; unitEl.value = match['Unit'] || ''; packEl.value = match['Packaging'] || '';
    if (vendorEl) vendorEl.value = match['Vendor'] || '';
    newOnly.style.display = 'none';
    if (saveBtn) { saveBtn.textContent = 'Daily-Market — entry allowed nahi'; saveBtn.disabled = true; }
    if (rateHistEl) rateHistEl.innerHTML = '';
    return;
  }
  if (match) {
    meta.innerHTML = `✔ Existing item — Currently ${match[PROD_FIELD.CURRENT]||0} ${match['Unit']} warehouse mein hai. Category/Unit/Packaging change karke Save Entry dabaoge to master record bhi update ho jayega.`;
    catEl.value = match['Category'] || '';
    unitEl.value = match['Unit'] || '';
    packEl.value = match['Packaging'] || '';
    if (vendorEl) vendorEl.value = match['Vendor'] || '';
    newOnly.style.display = 'none';
    if (saveBtn) saveBtn.textContent = 'Save Entry (Update Existing)';
    if (rateHistEl) rateHistEl.innerHTML = renderRateHistory(match['Item Name (Standardized)'], match[PROD_FIELD.RATE]);
  } else if (val.trim()) {
    meta.innerHTML = `🆕 Ye item mila nahi — Save karte hi Product & Stock Master mein naya item ban jayega.`;

    if (vendorEl) vendorEl.value = '';
    newOnly.style.display = 'block';

    if (rateHistEl) rateHistEl.innerHTML = '';
  } else {
    meta.innerHTML = '';
    catEl.value = ''; unitEl.value = ''; packEl.value = '';
    if (vendorEl) vendorEl.value = '';
    newOnly.style.display = 'none';
    if (saveBtn) saveBtn.textContent = 'Save Entry';
    if (rateHistEl) rateHistEl.innerHTML = '';

async function onWhVendorSelect(sel) {

// Visible "saving" state for entry submit buttons — a disabled button alone
// isn't obvious enough feedback that the save is actually in progress
// (especially over a slower connection), so this shows a spinner + text.
function btnSaving(btn, savingLabel) {
  btn.dataset.origText = btn.textContent; // captured fresh every call — the button's label can change between clicks (e.g. "New Product" vs "Update Existing")
  btn.disabled = true;
  btn.innerHTML = `<span style="display:inline-flex;align-items:center;justify-content:center;gap:8px;"><span class="spinner spinner-dark" style="border-color:#fff;border-top-color:rgba(255,255,255,.4);"></span>${savingLabel || 'Saving…'}</span>`;
}
// Use on the ERROR path only — restores whatever the button said right
// before this click. On the SUCCESS path, just clear btn.disabled directly;
// several of these forms already set the button's next-state text
// themselves right after a successful save (e.g. onWhItemInput('')), and
// calling this there would stomp that correct text back to the stale
// pre-click label.
function btnRestore(btn, textOverride) {
  btn.disabled = false;
  btn.textContent = textOverride || btn.dataset.origText || btn.textContent;
}
async function submitWarehouseEntry() {
  const itemName = document.getElementById('whItemInput').value.trim();
  const qty = Number(document.getElementById('whQty').value);
  const category = document.getElementById('whCategory').value.trim();
  const unit = document.getElementById('whUnit').value.trim();
  const packaging = document.getElementById('whPack').value.trim();
  const vendor = document.getElementById('whVendor').value;
  const rate = Number(document.getElementById('whRate').value) || 0;
  const expiryDate = document.getElementById('whExpiry').value || '';
  if (!itemName) { toast('Item ka naam likho', 'error'); return; }
  if (!qty || qty <= 0) { toast('Valid quantity daalo', 'error'); return; }
  if (!category || !unit) { toast('Category aur Unit dono bharo', 'error'); return; }
  const match = findProductByName(itemName);
  const payload = { qty, qtyMode: 'add', enteredBy: STATE.user.name, category, unit, packaging, rate, expiryDate };
  if (match) {
    payload.mode = 'existing'; payload.itemName = match['Item Name (Standardized)'];
  } else {
    payload.mode = 'new'; payload.newName = itemName; payload.newCategory = category; payload.newUnit = unit;
    payload.newPackaging = packaging;
    payload.newMinStock = document.getElementById('whNewMin').value;
    payload.newMaxStock = document.getElementById('whNewMax').value;
  }
  const btn = document.getElementById('whSaveBtn');
  btnSaving(btn, 'Saving…');
  try {
    const r = await api('addWarehouseEntry', payload);
    const priorVendor = match ? (match['Vendor'] || '') : '';
    const vendorChanged = vendor !== priorVendor;
    if (vendorChanged) {
      await api('setProductVendor', { itemName: r.itemName, vendor });
    }
    toast(`${r.itemName} — warehouse stock ab ${r.newValue} hai ✔`);
    // Stay on the entry page and clear the form so the next item can be
    // logged immediately — this is the "fast entry" flow. Patch STATE.products
    // in place instead of refetching the whole list over the network (saves
    // a ~2s round trip on every single entry) — the cache still gets
    // invalidated so any OTHER page that loads next sees fresh data.
    document.getElementById('whItemInput').value = '';
    document.getElementById('whQty').value = '';
    document.getElementById('whRate').value = '';
    document.getElementById('whExpiry').value = '';
    invalidateApiCache('getProducts'); invalidateApiCache('getCategories');
    if (match) {
      match[PROD_FIELD.CURRENT] = r.newValue;
      match[PROD_FIELD.OPENING] = (Number(match[PROD_FIELD.OPENING]) || 0) + qty;
      match['Category'] = category; match['Unit'] = unit; match['Packaging'] = packaging;
      if (vendorChanged) match['Vendor'] = vendor;
      if (rate > 0) match[PROD_FIELD.RATE] = rate;
      if (expiryDate) match[PROD_FIELD.EXPIRY] = expiryDate;
    } else {
      STATE.products.push({
        'Item Name (Standardized)': r.itemName, 'Category': category, 'Unit': unit, 'Packaging': packaging,
        [PROD_FIELD.CURRENT]: r.newValue, [PROD_FIELD.DEMAND]: 0, [PROD_FIELD.OPENING]: qty, [PROD_FIELD.PURCHASE]: 0,
        'Min': document.getElementById('whNewMin').value || '', 'Max': document.getElementById('whNewMax').value || '',
        'Vendor': vendor, [PROD_FIELD.RATE]: rate || '', [PROD_FIELD.EXPIRY]: expiryDate || '',
      });
      acInit('whItemInput', STATE.products.map(p=>p['Item Name (Standardized)']), onWhItemInput, 'New Product');
    }
    onWhItemInput(''); // also resets the button's label back to 'Save Entry'
    btn.disabled = false;
    document.getElementById('whItemInput').focus();
    loadWarehouseHistory();
  } catch (e) { toast(e.message, 'error'); btnRestore(btn); }
}

/* ================================================================
   DEMAND FOR CANTEEN — existing items only, deducts warehouse stock
   the moment it's raised (no new-item creation here)

// 1-hour edit/delete window for a Cashier's own still-Pending demand —
// mirrors DEMAND_EDIT_WINDOW_MS on the backend (Code.gs), kept in sync
// manually since there's no shared config between the two files.
const DEMAND_EDIT_WINDOW_MS = 60 * 60 * 1000; // 1 hour
// Groups an array of records by calendar day (using `field`, e.g.
// "Timestamp") — returns date groups newest-first, each with a human label
// and its items in their original (already-sorted) order.
function groupByDate(list, field) {
  const groups = {}; const order = [];
  list.forEach(item => {
    const key = new Date(item[field]).toDateString();
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(item);
  });
  return order.map(key => ({
    label: new Date(key).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }),
    items: groups[key],
  }));
}
// ---- Feedback: cashier can add/update feedback on their own APPROVED demand for 2 days after approval.
// Feedback is stored on the demand row, so Supervisor, Cashier and Admin always see it.
const DEMAND_FEEDBACK_WINDOW_MS = 2 * 24 * 60 * 60 * 1000; // mirrors Code.gs
function feedbackOpen(d) {
  if ((d['Status'] || 'Pending') !== 'Approved') return false;
  const base = new Date(d['Approved At'] || d['Timestamp']).getTime();
  return (Date.now() - base) <= DEMAND_FEEDBACK_WINDOW_MS;
}
function feedbackCellHtml(d) {

}
function feedbackBtnHtml(d, size) {

    : `<span style="font-size:11px;color:var(--ink-soft);">🔒 Feedback closed</span>`;
}
function escHtml(t) { return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function submitFeedbackDemand(row, btn) {
  const text = (document.getElementById('fbDmText').value || '').trim();
  if (!text) { toast('Feedback likho', 'error'); return; }
  const d0 = (STATE.demands || []).find(x => x._row === Number(row));
  const prev = d0 ? { Feedback: d0['Feedback'] || '', 'Feedback At': d0['Feedback At'] || '' } : null;
  const nowIso = new Date().toISOString();
  btnSaving(btn, 'Saving…');
  try {
    if (d0) { localMarkDemand(Number(row), { Feedback: text, 'Feedback At': nowIso }); }
    closeModal(); toast('Feedback save ho gaya ✔');
    if (STATE.page === 'demandEntry') renderDemandHistoryPanel(); else if (STATE.page === 'demand') renderDemand();
    await api('saveDemandFeedback', { row: Number(row), feedback: text, by: STATE.user.name });
    invalidateApiCache('getDemands');
  } catch (e) {
    if (d0 && prev) localMarkDemand(Number(row), prev);

function itemStockType(itemName) {
  const pr = findProductByName(itemName);
  return pr ? (pr[PROD_FIELD.STOCKTYPE] || 'Stocked') : 'Stocked';
}
// Stock Type is sometimes typed/stored as "Daily-Market" (hyphen) and
// sometimes "Daily Market" (space, matching the real sheet's dropdown list)
// — never guess which one a given cell uses, treat hyphen/space as
// equivalent everywhere this is checked, so neither form silently falls
// through as "Stocked" (which would wrongly deduct warehouse stock for it).
function isDailyMarketType(v) { return String(v || '').toLowerCase().replace(/[\s-]+/g, '') === 'dailymarket'; }
function demandRowHtml(d, canApprove, canWrite) {

  // its real sheet row — never offer Approve/Edit/Delete on it yet, or the
  // action would fire against an invalid row number and fail.
  const synced = !d._saving && d._row > 0;

  // gatekeeping). Daily-Market items: any Cashier self-approves (bought
  // fresh from the market day to day — no finite stock to protect), so who

  // the item's Stock Type, not just the page-level role.
  const rowCanApprove = pending && synced && (isDailyMarket ? STATE.user.permission === 'Cashier' : canApprove);
  const editable = canWrite && synced && !rowCanApprove && pending && d['Raised By'] === STATE.user.name && (Date.now() - new Date(d['Timestamp']).getTime()) <= DEMAND_EDIT_WINDOW_MS;
  // Approved = clearly GREEN row (same for Cashier, Supervisor, Admin)

  const pillClass = approved ? 'pill-ok' : (rejected ? 'pill-bad' : (cancelled ? 'pill-mute' : 'pill-warn'));
  const stockCell = isDailyMarket ? '<span style="font-size:11px;color:var(--ink-soft);">Daily Market</span>' : (() => { const pr = findProductByName(d['Item Name']); const cs = pr ? Number(pr[PROD_FIELD.CURRENT]) || 0 : null; const low = cs !== null && Number(d['Qty Requested']) > cs; return cs === null ? '—' : `<b style="color:${low ? 'var(--red)' : 'var(--green)'};">${cs}</b> <span style="font-size:11px;color:var(--ink-soft);">${d['Unit']}</span>${low && pending ? '<div style="font-size:10px;color:var(--red);">stock kam (phir bhi approve ho sakta hai)</div>' : ''}`; })();
  // Approved Qty column: whoever can act on THIS row gets a qty input PLUS
  // a Unit dropdown right beside it on Pending rows (so the unit gets
  // corrected exactly where the approve qty is being decided, not mixed
  // into the plain "Qty Requested" display) — same native Unit + Base Unit
  // + "+ Naya Unit…" pattern as the Cashier's own raise-demand dropdown.
  // Everyone sees the final qty+unit once approved.
  const apprCell = (rowCanApprove && pending)
    ? `<input type="number" min="0" inputmode="decimal" class="input dmApproveQty" data-row="${d._row}" value="${d['Qty Requested']}" onkeydown="if(event.key==='Enter'){approveDemandRow(${d._row});}" style="width:70px;padding:5px 7px;font-size:13px;border:2px solid var(--orange);">
       <select id="dmRowUnit${d._row}" class="input" style="width:auto;display:inline-block;padding:5px 6px;font-size:12px;margin-left:4px;" onchange="onUnitSelectChange(this)"></select>`
    : (approved ? `<b style="color:var(--green);">${d['Approved Qty']}</b> ${d['Unit']}` : '—');
  let actionCell = '';
  if (rowCanApprove) {
    // Daily-Market items are bought fresh from the market, often by
    // whoever's free at the moment — not necessarily the same person who
    // raised the demand — so the approving Cashier gets a remarks box right
    // here to note who actually went and got it (or any other note). Saved
    // as this demand's Feedback, which Supervisor/Admin already see in the
    // Feedback column — no separate step needed after approving.
    const remarksBox = isDailyMarket
      ? `<input id="dmRemarks${d._row}" class="input" placeholder="Kaun laaya? / note (optional)" style="width:150px;padding:5px 7px;font-size:12px;margin-bottom:5px;display:block;">`
      : '';
    actionCell = `<td style="white-space:nowrap;">
      ${remarksBox}
      <button class="btn" id="dmAppr${d._row}" style="padding:5px 12px;font-size:12.5px;background:var(--green);color:#fff;font-weight:700;" onclick="approveDemandRow(${d._row})">✔ Approve</button>
      <button class="btn btn-ghost" style="padding:5px 8px;color:var(--red);font-size:12px;" onclick="rejectDemandRow(${d._row})">Reject</button></td>`;
  } else if (canWrite) {
    actionCell = `<td>${editable ? `
    <button class="btn btn-outline" style="padding:3px 8px;font-size:12px;" onclick='openEditDemand(${JSON.stringify(d)})'>Edit</button>
    <button class="btn btn-ghost" style="padding:3px 8px;color:var(--red);font-size:12px;" onclick='confirmDeleteDemand(${d._row})'>Delete</button>
  ` : (pending ? (isDailyMarket ? `<span style="font-size:11px;color:var(--ink-soft);">Kisi Cashier ko approve karna hai</span>` : `<span style="font-size:11px;color:var(--ink-soft);">🔒 Locked</span>`) : feedbackBtnHtml(d, '12px'))}</td>`;
  } else if (canApprove) {
    actionCell = `<td>${pending ? `<span style="font-size:11px;color:var(--ink-soft);">Cashier khud approve karega (Daily Market)</span>` : (approved ? '<span style="color:var(--green);font-weight:700;font-size:12.5px;">✔ Approved</span>' : '')}</td>`;
  }

  <td style="font-weight:600;">${d['Item Name']}</td><td>${d['Qty Requested']} ${d['Unit']}</td>
  ${canApprove ? `<td>${stockCell}</td>` : ''}

  <td><span class="pill ${pillClass}">${status}</span></td>
