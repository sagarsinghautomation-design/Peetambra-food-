</tr>`;
}
async function renderDemand() {
  const [demands, products] = await Promise.all([api('getDemands',{}), api('getProducts',{})]);
  if (STATE.page !== 'demand') return;
  STATE.demands = demands; STATE.products = products;
  // Demand-raising belongs to Cashier only. Supervisor sees the same data
  // but with an approval UI instead of a raise button — a Pending demand is
  // just a request, no stock has moved yet; approving it is what actually
  // deducts warehouse stock (using the approved qty, not the requested one).
  const canWrite = STATE.user.permission === 'Cashier';
  const canApprove = STATE.user.permission === 'Supervisor';
  // Supervisor's queue is action-focused: only Pending requests need
  // attention, grouped by date so a busy day is easy to scan. Once
  // approved, a demand drops off this list entirely — its record lives on
  // the Dashboard's "Approved Demands" panel instead (see renderMyDashboard).
  // Admin keeps seeing the complete, unfiltered history (all statuses).
  // Supervisor: all Pending + anything approved/rejected in the last 2 days (approved stays visible in GREEN).
  const _cut = Date.now() - 2 * 24 * 3600 * 1000;
  const visibleDemands = canApprove ? demands.filter(d => (d['Status'] || 'Pending') === 'Pending' || (d['Status'] !== 'Cancelled' && new Date(d['Timestamp']).getTime() >= _cut)) : demands;
  const colspan = 8 + (canApprove ? 2 : 0) + (canWrite ? 1 : 0);
  const emptyMsg = canApprove ? 'Koi demand nahi hai.' : 'No demands raised yet.';
  let bodyHtml;
  if (canApprove) {
    const groups = groupByDate(visibleDemands, 'Timestamp');
    bodyHtml = groups.length ? groups.map(g => `
      <tr><td colspan="${colspan}" style="background:var(--line);font-weight:700;font-size:12.5px;padding:8px 14px;color:var(--ink-soft);">${g.label}</td></tr>
      ${g.items.map(d => demandRowHtml(d, canApprove, canWrite)).join('')}
    `).join('') : `<tr><td colspan="${colspan}" style="text-align:center;color:var(--ink-soft);padding:24px;">${emptyMsg}</td></tr>`;
  } else {
    bodyHtml = visibleDemands.length ? visibleDemands.map(d => demandRowHtml(d, canApprove, canWrite)).join('') : `<tr><td colspan="${colspan}" style="text-align:center;color:var(--ink-soft);padding:24px;">${emptyMsg}</td></tr>`;
  }
  const main = document.getElementById('mainContent');
  const _typed = {}; document.querySelectorAll('.dmApproveQty').forEach(i => { if (i.value !== i.defaultValue) _typed[i.dataset.row] = i.value; });
  main.innerHTML = `
  <div class="flex justify-between items-center mb-4">
    <p style="color:var(--ink-soft);font-size:13px;">${canApprove ? 'Stocked items: Approve Qty box mein qty daalo (default = requested) aur ✔ Approve dabao — warehouse stock utna hi deduct hoga (stock kam ho to bhi approve ho sakta hai). Daily-Market items Cashier khud approve karta hai.' : (canWrite ? 'Stocked item ki demand Supervisor approve karega. Daily-Market item (jaise roz mandi se aane wali cheezein) khud approve kar sakte ho — inme warehouse stock deduct nahi hota.' : 'Cashier raises a request — Stocked items Supervisor approve karta hai, Daily-Market items Cashier khud.')}</p>
    ${canWrite ? `<button class="btn btn-primary" onclick="goTo('demandEntry')">+ Raise Demand</button>` : ''}
  </div>
  <div class="card p-0 overflow-x-auto">
    <table><thead><tr><th>Item</th><th>Qty Requested</th>${canApprove ? '<th>Current Stock</th>' : ''}<th>Raised By</th><th>${(canApprove || canWrite) ? 'Approve Qty' : 'Approved Qty'}</th><th>Remarks</th><th>Feedback</th><th>Date</th><th>Status</th>${(canWrite || canApprove) ? '<th>' + (canApprove ? 'Action' : '') + '</th>' : ''}</tr></thead>
    <tbody>${bodyHtml}</tbody></table>
  </div>
  `;
  Object.keys(_typed).forEach(r => { const el = document.querySelector(`.dmApproveQty[data-row="${r}"]`); if (el) el.value = _typed[r]; });
  initDemandRowUnitSelects();
}
// Populates each row's correctable unit dropdown (native Unit + Base Unit +
// whatever unit the demand was actually raised in, which may be an old
// free-typed mess like "psc"/"sese pkt") — same build pattern as the
// Cashier's own dmUnit select in onDmItemInput, just per-row.
function initDemandRowUnitSelects() {
  (STATE.demands || []).forEach(d => {
    const sel = document.getElementById('dmRowUnit' + d._row);
    if (!sel) return;
    const pr = findProductByName(d['Item Name']);
    const nativeUnit = pr ? (pr['Unit'] || '') : '';
    const baseUnit = pr ? (pr[PROD_FIELD.BASEUNIT] || '') : '';
    const hasBaseUnit = baseUnit && baseUnit.toLowerCase() !== nativeUnit.toLowerCase();
    const currentUnit = d['Unit'] || nativeUnit;
    const options = [nativeUnit];
    if (hasBaseUnit) options.push(baseUnit);
    if (currentUnit && !options.some(u => u.toLowerCase() === String(currentUnit).toLowerCase())) options.push(currentUnit);
    sel.innerHTML = options.filter(Boolean).map(u =>
      `<option value="${u}" ${String(u).toLowerCase() === String(currentUnit).toLowerCase() ? 'selected' : ''}>${u}</option>`).join('')
      + `<option value="__new__">+ Naya Unit…</option>`;
    sel.dataset.prevValue = currentUnit;
  });
}
// Optimistic: the rows vanish from the list INSTANTLY and the stock numbers update on
// screen; the request runs in the background (one single call for all selected rows).
// If the server refuses any row (e.g. stock too low) that row is put back with the reason.
function localMarkDemand(row, patch) {
  const d = (STATE.demands || []).find(x => x._row === row);
  if (d) Object.assign(d, patch);
  return d;
}
function localAdjustProduct(itemName, deltas) {
  const p = findProductByName(itemName);
  if (!p) return;
  Object.keys(deltas).forEach(f => { p[f] = Math.max(0, (Number(p[f]) || 0) + deltas[f]); });
  p[PROD_FIELD.CURRENT] = (Number(p[PROD_FIELD.OPENING]) || 0) + (Number(p[PROD_FIELD.PURCHASE]) || 0) - (Number(p[PROD_FIELD.APPROVED]) || 0);
  persistCacheSoon();
}
function rejectDemandRow(row) {
  const rows = [Number(row)];
  confirmDialog('Reject demand?', 'Ye demand reject ho jayegi. Stock pe koi asar nahi padega — sirf status "Rejected" hoga.', async () => {
    const undo = [];
    rows.forEach(r => {
      const d = localMarkDemand(r, { Status: 'Rejected' });
      if (d) { undo.push({ row: r, d }); localAdjustProduct(d['Item Name'], { [PROD_FIELD.DEMAND]: -Number(d['Qty Requested']) }); }
    });
    renderDemand();
    LAST_PENDING_DEMAND_COUNT = Math.max(0, (LAST_PENDING_DEMAND_COUNT || rows.length) - rows.length); setDemandNavBadge(LAST_PENDING_DEMAND_COUNT);
    toast('Demand reject ho gayi ✔');
    try {
      const r = await api('rejectDemands', { rows });
      const failed = (r.results || []).filter(x => !x.ok);
      if (failed.length) { toast(failed[0].error, 'error'); invalidateApiCache(); rerenderCurrent(); }
    } catch (e) {
      rows.forEach(r => localMarkDemand(r, { Status: 'Pending' }));
      toast(e.message + ' — demand wapas list mein aa gayi', 'error'); invalidateApiCache(); renderDemand();
    }
  });
}
// Per-row approve: whoever can act on this row (Supervisor for Stocked,
// any Cashier for Daily-Market) types the approved qty, taps ✔ Approve.
// Row turns GREEN instantly (optimistic); server call runs in the
// background. Approving MORE than what's currently in stock is allowed
// (not blocked) for Stocked items — the server just comes back with a
// warning toast instead of rejecting it. Daily-Market items never touch
// Current Stock at all (no finite warehouse stock to deplete).
async function approveDemandRow(row) {
  row = Number(row);
  const qtyInput = document.querySelector(`.dmApproveQty[data-row="${row}"]`);
  if (!qtyInput) return;
  const approvedQty = Number(qtyInput.value);
  if (qtyInput.value === '' || isNaN(approvedQty) || approvedQty < 0) { toast('Approve qty sahi daalo', 'error'); qtyInput.focus(); return; }
  const d0 = (STATE.demands || []).find(x => x._row === row);
  if (!d0 || (d0['Status'] || 'Pending') !== 'Pending') return;          // double-tap guard
  const pr = findProductByName(d0['Item Name']);
  const isDailyMarket = pr && isDailyMarketType(pr[PROD_FIELD.STOCKTYPE] || 'Stocked');
  const btn = document.getElementById('dmAppr' + row); if (btn) btn.disabled = true;
  // The approver may have corrected the Unit (see initDemandRowUnitSelects) —
  // only send it along if it actually differs from what's stored, so it
  // gets persisted on the Demand row and used for the stock-math conversion.
  const unitSel = document.getElementById('dmRowUnit' + row);
  const unitOverride = (unitSel && unitSel.value && unitSel.value !== '__new__' && unitSel.value !== d0['Unit']) ? unitSel.value : null;
  // Daily-Market's inline "Kaun laaya?" remarks box, if the approving
  // Cashier filled one in — saved as this demand's Feedback so it's
  // immediately visible to Supervisor/Admin, no separate step needed.
  const remarksEl = document.getElementById('dmRemarks' + row);
  const remarks = remarksEl ? remarksEl.value.trim() : '';
  const items = [{ row, approvedQty, ...(unitOverride ? { unit: unitOverride } : {}), ...(remarks ? { feedback: remarks } : {}) }];
  const d = localMarkDemand(row, { Status: 'Approved', 'Approved Qty': approvedQty, 'Approved At': new Date().toISOString(), ...(unitOverride ? { Unit: unitOverride } : {}), ...(remarks ? { Feedback: remarks, 'Feedback At': new Date().toISOString() } : {}) });
  if (d && !isDailyMarket) localAdjustProduct(d['Item Name'], { [PROD_FIELD.APPROVED]: approvedQty });
  renderDemand();                                   // instant -> row is green
  LAST_PENDING_DEMAND_COUNT = Math.max(0, (LAST_PENDING_DEMAND_COUNT || 1) - 1); setDemandNavBadge(LAST_PENDING_DEMAND_COUNT);
  toast('Demand approve ho gayi ✔');
  try {
    const r = await api('approveDemands', { items });
    const failed = (r.results || []).filter(x => !x.ok);
    if (failed.length) {
      const dd = localMarkDemand(row, { Status: 'Pending', 'Approved Qty': '', ...(unitOverride ? { Unit: d0['Unit'] } : {}) });
      if (dd && !isDailyMarket) localAdjustProduct(dd['Item Name'], { [PROD_FIELD.APPROVED]: -approvedQty });
      toast(failed[0].error, 'error');
    } else {
      const warned = (r.results || []).find(x => x.warning);
      if (warned) toast(warned.warning, 'error');
    }
    invalidateApiCache(); rerenderCurrent();
  } catch (e) {
    const dd = localMarkDemand(row, { Status: 'Pending', 'Approved Qty': '', ...(unitOverride ? { Unit: d0['Unit'] } : {}) });
    if (dd && !isDailyMarket) localAdjustProduct(dd['Item Name'], { [PROD_FIELD.APPROVED]: -approvedQty });
    toast(e.message + ' — demand wapas list mein aa gayi', 'error'); invalidateApiCache(); renderDemand();
  }
}

// Existing item: shows Current Stock in BOTH carton and pcs terms (when the
// item actually has a bulk Base Unit different from its native Unit), plus
// a Unit dropdown offering native Unit + Base Unit — pre-selected to
// whatever this item's saved "Demand Unit" is — and the item's saved Stock
// Type. New item (typed name not found): shows minimal Category + Unit
// fields instead, used to auto-create the product on submit.
// "5 pkt + 18 pcs" style breakdown — whole packs you can physically count,
// plus the loose remainder — instead of a raw decimal like "5.9 pkt",
// which doesn't tell you how to actually count the shelf.
function stockPackSummary(match) {
  const cur = Number(match[PROD_FIELD.CURRENT]) || 0;
  const nativeUnit = match['Unit'] || '';
  const baseUnit = match[PROD_FIELD.BASEUNIT] || '';
  const stockUnitQty = Number(match[PROD_FIELD.STOCKUNITQTY]) || 1;
  const hasBaseUnit = baseUnit && baseUnit.toLowerCase() !== nativeUnit.toLowerCase();
  // Negative stock (approved beyond what was on hand) can't be floor-split
  // into packs sensibly — e.g. -5 pcs would render as "-1 pkt + 15 pcs",
  // which reads as a small positive amount instead of a shortage. Show it
  // as a plain negative number instead, same as the no-base-unit case.
  if (!hasBaseUnit || cur < 0) return { cur, nativeUnit, text: `${cur} ${nativeUnit}` };
  const fullPacks = Math.floor(cur / stockUnitQty);
  const loose = Math.round((cur - fullPacks * stockUnitQty) * 100) / 100;
  return { cur, nativeUnit, text: `${fullPacks} ${baseUnit} + ${loose} ${nativeUnit}` };
}
// Shared by BOTH roles — Cashier's "dmUnit" dropdown when raising a demand,
// and Supervisor's (or self-approving Cashier's) per-row unit dropdown when
// reviewing one. Picking "+ Naya Unit…" prompts for a name and requires an
// explicit confirm before it's accepted — a typo or ambiguous unit (the
// "psc" / "sese pkt" kind of mess that free-typing used to produce) should
// never slip in silently, for either role.
function onUnitSelectChange(sel) {
  if (sel.value !== '__new__') { sel.dataset.prevValue = sel.value; return; }
  const fallback = sel.dataset.prevValue || (sel.options[0] ? sel.options[0].value : '');
  sel.value = fallback; // reset immediately — only set to the new unit if the confirm below is accepted
  const name = (prompt('Naya unit ka naam likho (jaise: dibba, ctn, box):') || '').trim();
  if (!name) return;
  confirmDialog('Naya unit banayein?', `"${name}" ek naya unit hai, is item ke liye pehli baar use ho raha hai. Pakka banana chahte ho?`, () => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    sel.insertBefore(opt, sel.lastElementChild);
    sel.value = name; sel.dataset.prevValue = name;
  });
}
function onDmItemInput(val) {
  val = val !== undefined ? val : document.getElementById('dmItemInput').value;
  const match = findProductByName(val);
  const meta = document.getElementById('dmItemMeta');
  const newFields = document.getElementById('dmNewItemFields');
  const unitWrap = document.getElementById('dmUnitFieldWrap');
  const unitSel = document.getElementById('dmUnit');
  const stockTypeSel = document.getElementById('dmStockType');
  if (!meta) return;
  if (match) {
    const expiry = match[PROD_FIELD.EXPIRY] ? new Date(match[PROD_FIELD.EXPIRY]).toLocaleDateString() : null;
    const nativeUnit = match['Unit'] || '';
    const baseUnit = match[PROD_FIELD.BASEUNIT] || '';
    const hasBaseUnit = baseUnit && baseUnit.toLowerCase() !== nativeUnit.toLowerCase();
    const summary = stockPackSummary(match);
    const col = summary.cur <= 0 ? 'var(--red)' : 'var(--green)';
    meta.innerHTML = `<div style="display:inline-flex;align-items:baseline;gap:8px;background:#FFF8EF;border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:6px;flex-wrap:wrap;">

      `<br>Category: <b>${match['Category']||'-'}</b> &nbsp;•&nbsp; Packaging: <b>${match['Packaging']||'-'}</b>` +
      (expiry ? ` &nbsp;•&nbsp; Expiry: <b>${expiry}</b>` : '');
    newFields.style.display = 'none';
    unitWrap.style.display = 'block';
    const options = [nativeUnit];
    if (hasBaseUnit) options.push(baseUnit);
    const savedDemandUnit = match[PROD_FIELD.DEMANDUNIT] || nativeUnit;
    if (savedDemandUnit && !options.some(u => u.toLowerCase() === String(savedDemandUnit).toLowerCase())) options.push(savedDemandUnit);
    unitSel.innerHTML = options.filter(Boolean).map(u =>
      `<option value="${u}" ${String(u).toLowerCase()===String(savedDemandUnit).toLowerCase()?'selected':''}>${u}</option>`).join('')
      + `<option value="__new__">+ Naya Unit…</option>`;
    unitSel.dataset.prevValue = savedDemandUnit || nativeUnit;

  } else if (val.trim()) {
    meta.innerHTML = `🆕 Ye item mila nahi — Save karte hi Product & Stock Master mein naya item ban jayega.`;
    newFields.style.display = 'block';
    unitWrap.style.display = 'none';

  } else {
    meta.innerHTML = '';
    newFields.style.display = 'none';
    unitWrap.style.display = 'none';
  }
}
// A fast double-tap (or a mobile "ghost click") on Submit, before the first
// tap's own click handler has had a chance to disable the button, could
// otherwise fire submitDemand() twice and raise the SAME demand twice. This
// flag blocks any re-entry the instant a submission is underway — checked
// before even reading the form, so it can never race.
let DEMAND_SUBMIT_BUSY = false;
async function submitDemand() {
  if (DEMAND_SUBMIT_BUSY) return;
  const itemName = document.getElementById('dmItemInput').value.trim();
  const match = findProductByName(itemName);
  const qty = Number(document.getElementById('dmQty').value);
  const stockType = document.getElementById('dmStockType').value;
  const notes = document.getElementById('dmNotes').value.trim();
  if (!itemName) { toast('Item ka naam likho', 'error'); return; }
  if (!qty || qty <= 0) { toast('Enter a quantity', 'error'); return; }

  const payload = { raisedBy: STATE.user.name, qty, notes, stockType };
  let displayUnit, displayItemName;
  if (match) {
    payload.mode = 'existing'; payload.itemName = match['Item Name (Standardized)'];
    payload.category = match['Category'];
    payload.unit = document.getElementById('dmUnit').value;
    payload.demandUnit = payload.unit;
    displayUnit = payload.unit; displayItemName = match['Item Name (Standardized)'];
  } else {
    const newCategory = document.getElementById('dmNewCategory').value.trim();
    const newUnit = document.getElementById('dmNewUnit').value.trim();
    if (!newCategory || !newUnit) { toast('Category aur Unit bharo', 'error'); return; }
    payload.mode = 'new'; payload.newName = itemName; payload.newCategory = newCategory; payload.newUnit = newUnit;
    displayUnit = newUnit; displayItemName = itemName;
  }

  // All validation passed — this click is really going through, so lock out
  // any further taps until it's fully done (success or failure).
  DEMAND_SUBMIT_BUSY = true;
  const dmSaveBtn = document.getElementById('dmSaveBtn');
  if (dmSaveBtn) btnSaving(dmSaveBtn, 'Bhej rahe hain…');

  // instant: show it in "Recent Demands" right now, send to server in the background
  const local = {
    _row: -Date.now(), 'Item Name': displayItemName, 'Qty Requested': qty, 'Unit': displayUnit,
    'Raised By': STATE.user.name, 'Timestamp': new Date().toISOString(), 'Status': 'Pending', 'Notes': notes, _saving: true,
  };
  STATE.demands.unshift(local);
  if (match) localAdjustProduct(displayItemName, { [PROD_FIELD.DEMAND]: qty }); // optimistic preview only — server applies the real unit-aware math
  document.getElementById('dmItemInput').value = '';
  document.getElementById('dmQty').value = '';
  document.getElementById('dmNotes').value = '';
  onDmItemInput('');
  renderDemandHistoryPanel();
  toast('Demand bhej di — Supervisor approve karega ✔');
  try {
    const r = await api('addDemand', payload);
    local._row = r.row; delete local._saving;
    renderDemandHistoryPanel();
    invalidateApiCache('getProducts');
  } catch (e) {
    STATE.demands = STATE.demands.filter(d => d !== local);
    if (match) localAdjustProduct(displayItemName, { [PROD_FIELD.DEMAND]: -qty });
    renderDemandHistoryPanel();
    toast(e.message + ' — demand save nahi hui, dobara bhejo', 'error');
    document.getElementById('dmItemInput').value = displayItemName; document.getElementById('dmQty').value = qty; document.getElementById('dmNotes').value = notes;
    onDmItemInput(displayItemName);
  } finally {
    DEMAND_SUBMIT_BUSY = false;
    if (dmSaveBtn) btnRestore(dmSaveBtn, 'Submit Demand');
  }
}

/* ================================================================

function renderPOBatchList(canManage) {

function togglePoBatchSelectAll(headerCb, vendor, batchId) {
  document.querySelectorAll(`.po-item-check[data-vendor="${vendor}"][data-batch="${batchId}"]`).forEach(cb => { cb.checked = headerCb.checked; });
}
async function generateBatch(vendor, batchId, btn) {
  const checked = Array.from(document.querySelectorAll(`.po-item-check[data-vendor="${vendor}"][data-batch="${batchId}"]:checked`)).map(cb => Number(cb.value));
  if (!checked.length) { toast('Kam se kam ek item select karo', 'error'); return; }
  if (btn) btnSaving(btn, 'Generating PDF…'); // this one also builds a PDF server-side, so it's genuinely slower than a plain save
  try {
    const r = await api('generatePOBatch', { vendor, batchId, rows: checked });
    toast(`PO generated — ${r.itemCount} item(s) ✔${r.remainingPending ? ` (${r.remainingPending} baaki batch mein pending hai)` : ''}`);
    goTo('po');
  } catch (e) { toast(e.message, 'error'); if (btn) btnRestore(btn); }
}
function shareBatchWhatsApp(vendor, batchId) {
  const batches = window.__PO_BATCHES || [];
  const b = batches.find(x => x.vendor === vendor && x.batchId === batchId);
  if (!b) return;
  // Only the items actually Generated (ordered) go on the WhatsApp share —
  // any still-Pending items in this same batch (left unchecked on purpose,
  // waiting for a future Generate) haven't been ordered yet and must not
  // appear on a PO message that's about to be sent to the vendor.
  const items = b.items.filter(i => i.status === 'Generated');
  const lines = items.map((i, idx) => `${idx+1}. ${i.name} — ${i.qty} ${i.unit}`);
  const text = `*Purchase Order — ${vendor}*\nBatch: ${batchId}\n\n${lines.join('\n')}`;

}

function renderMpRateHistory(itemName, currentRate) {
  const past = (STATE.manualPurchases || [])
    .filter(e => e['Item Name'] === itemName && Number(e['Rate']) > 0)
    .sort((a, b) => new Date(b['Timestamp']) - new Date(a['Timestamp']))
    .slice(0, 5);
  const parts = [];
  if (currentRate) parts.push(`<b>Current rate: ₹${currentRate}</b>`);
  if (past.length) parts.push('Old rates: ' + past.map(e => `₹${e['Rate']} (${new Date(e['Timestamp']).toLocaleDateString()})`).join(', '));
  return parts.length ? parts.join(' — ') : '';
}

async function submitManualPurchase() {
  const itemName = document.getElementById('mpItemInput').value.trim();
  const qty = Number(document.getElementById('mpQty').value);
  const category = document.getElementById('mpCategory').value.trim();
  const unit = document.getElementById('mpUnit').value.trim();
  const packaging = document.getElementById('mpPack').value.trim();
  const vendor = document.getElementById('mpVendor').value;
  const rate = Number(document.getElementById('mpRate').value) || 0;
  const expiryDate = document.getElementById('mpExpiry').value || '';
  if (!itemName) { toast('Item ka naam likho', 'error'); return; }
  if (!qty || qty <= 0) { toast('Valid quantity daalo', 'error'); return; }
  if (!category || !unit) { toast('Category aur Unit dono bharo', 'error'); return; }
  const match = findProductByName(itemName);
  const payload = { qty, enteredBy: STATE.user.name, category, unit, packaging, rate, expiryDate };
  if (match) {
    payload.mode = 'existing'; payload.itemName = match['Item Name (Standardized)'];
  } else {
    payload.mode = 'new'; payload.newName = itemName; payload.newCategory = category; payload.newUnit = unit;
    payload.newPackaging = packaging;
    payload.newMinStock = document.getElementById('mpNewMin').value;
    payload.newMaxStock = document.getElementById('mpNewMax').value;
  }
  const btn = document.getElementById('mpSaveBtn');
  btnSaving(btn, 'Saving…');
  try {
    const r = await api('addManualPurchase', payload);
    const priorVendor = match ? (match['Vendor'] || '') : '';
    const vendorChanged = vendor !== priorVendor;
    if (vendorChanged) {
      await api('setProductVendor', { itemName: r.itemName, vendor });
    }
    toast(`${r.itemName} — Purchase Stock mein add ho gaya, ab current stock ${r.newValue} hai ✔`);
    document.getElementById('mpItemInput').value = '';
    document.getElementById('mpQty').value = '';
    document.getElementById('mpRate').value = '';
    document.getElementById('mpExpiry').value = '';
    invalidateApiCache('getProducts'); invalidateApiCache('getCategories');
    if (match) {
      match[PROD_FIELD.CURRENT] = r.newValue;
      match[PROD_FIELD.PURCHASE] = (Number(match[PROD_FIELD.PURCHASE]) || 0) + qty;
      match['Category'] = category; match['Unit'] = unit; match['Packaging'] = packaging;
      if (vendorChanged) match['Vendor'] = vendor;
      if (rate > 0) match[PROD_FIELD.RATE] = rate;
      if (expiryDate) match[PROD_FIELD.EXPIRY] = expiryDate;
    } else {
      STATE.products.push({
        'Item Name (Standardized)': r.itemName, 'Category': category, 'Unit': unit, 'Packaging': packaging,
        [PROD_FIELD.CURRENT]: r.newValue, [PROD_FIELD.DEMAND]: 0, [PROD_FIELD.OPENING]: 0, [PROD_FIELD.PURCHASE]: qty,
        'Min': document.getElementById('mpNewMin').value || '', 'Max': document.getElementById('mpNewMax').value || '',
        'Vendor': vendor, [PROD_FIELD.RATE]: rate || '', [PROD_FIELD.EXPIRY]: expiryDate || '',
      });
      acInit('mpItemInput', STATE.products.map(p=>p['Item Name (Standardized)']), onMpItemInput, 'New Product');
    }
    onMpItemInput('');
    btn.disabled = false;
    document.getElementById('mpItemInput').focus();
    loadManualPurchaseHistory();
  } catch (e) { toast(e.message, 'error'); btnRestore(btn); }
}

function cylCapturePhoto() {

  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
  window.capturedCylPhoto = dataUrl;
  document.getElementById('cylPreview').src = dataUrl;
  document.getElementById('cylPreview').style.display = 'block';
  video.style.display = 'none';
  document.getElementById('cylCaptureBtn').style.display = 'none';
  document.getElementById('cylRetakeBtn').style.display = 'inline-flex';
  document.getElementById('cylSubmitBtn').style.display = 'block';
  if (cylinderStream) cylinderStream.getTracks().forEach(t=>t.stop());
}
async function submitCylinderEntry() {
  const qty = Number(document.getElementById('cylQty').value);
  if (!window.capturedCylPhoto) { toast('Cylinder ki photo lo pehle', 'error'); return; }
  if (!qty || qty <= 0) { toast('Kitne cylinder aaye, wo daalo', 'error'); return; }
  const btn = document.getElementById('cylSubmitBtn');
  btnSaving(btn, 'Saving…');
  const payload = { receivedBy: STATE.user.name, qty, photoBase64: window.capturedCylPhoto };
  try {
    if (!navigator.onLine) throw new Error('offline');
    const r = await api('addCylinderEntry', payload);
    toast(`${r.qty} cylinder saved — ₹${r.total} ✔`);
    goTo('cylinder');
  } catch (e) {
    const q = getQueue(); q.push({ ...payload, __action: 'addCylinderEntry' }); setQueue(q);
    toast('No connection — saved offline, will auto-sync ⏳', 'error');
    startCylCamera();
  } finally {
    btn.textContent = '✅ Save Cylinder Entry';
    btn.disabled = false;
  }
}

// Local calendar-day key (yyyy-MM-dd) using the BROWSER's local timezone —
// avoids the UTC-offset day-shift bug that toISOString() has near midnight.
function localDateKey(d) {
  d = d instanceof Date ? d : new Date(d);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayISO() { return localDateKey(new Date()); }
// Canteen staff work an 8 AM – 3 AM (next day) shift — matches
// businessDateKey() in Code.gs exactly. A punch between midnight and 3 AM
// still belongs to the PREVIOUS calendar day's shift, so an overnight
// IN→OUT pair (e.g. 8 AM to 1 AM, a 17-hour duty) stays attributed to the
// one day it started on instead of being split across two calendar dates.
function businessDayKeyOf(d) {
  d = d instanceof Date ? new Date(d) : new Date(d);
  if (d.getHours() < 3) d.setDate(d.getDate() - 1);
  return localDateKey(d);
}
function currentBusinessDayKey() { return businessDayKeyOf(new Date()); }
function setReportRange(mode) {
  REPORT_RANGE.mode = mode;
  if (mode !== 'custom') renderReports(); else { REPORT_RANGE.from = todayISO(); REPORT_RANGE.to = todayISO(); renderReports(); }
}
function applyCustomRange() {
  REPORT_RANGE.from = document.getElementById('repFrom').value;
  REPORT_RANGE.to = document.getElementById('repTo').value;
  renderReportsBody();
}
function onReportStaffChange(userId) {
  REPORT_STAFF = userId;
  renderReportsBody();
}
function rangeBounds() {
  const now = new Date();
  if (REPORT_RANGE.mode === 'today') {
    const s = new Date(now); s.setHours(0,0,0,0);
    const e = new Date(now); e.setHours(23,59,59,999);
    return [s, e];
  }
  if (REPORT_RANGE.mode === 'week') {
    const day = now.getDay();
    const s = new Date(now); s.setDate(now.getDate() - day); s.setHours(0,0,0,0);
    const e = new Date(now); e.setHours(23,59,59,999);
    return [s, e];
  }
  const s = new Date(REPORT_RANGE.from + 'T00:00:00');
  const e = new Date(REPORT_RANGE.to + 'T23:59:59');
  return [s, e];
}
function renderReportsBody() {
  const [from, to] = rangeBounds();
  const rangeLabel = REPORT_RANGE.mode==='today' ? 'Today' : REPORT_RANGE.mode==='week' ? 'This Week' : `${REPORT_RANGE.from} to ${REPORT_RANGE.to}`;
  const filteredRows = REPORT_STAFF==='all' ? REPORTS_DATA.attendance : REPORTS_DATA.attendance.filter(a => a['User ID']===REPORT_STAFF);
  const allSessions = pairAttendance(filteredRows).filter(s => s.dateObj >= new Date(from.toDateString()) && s.dateObj <= to);
  const body = document.getElementById('reportsBody');
  if (!body) return;

  if (REPORT_STAFF !== 'all') {
    const person = REPORTS_DATA.staff.find(s => s['User']===REPORT_STAFF);
    const totalHours = Math.round(allSessions.reduce((s,x)=>s+(x.hours||0),0)*10)/10;
    const lateCount = allSessions.filter(s=>s.inStatus==='Late').length;
    // Fill every day in the selected range with Leave where there's no real
    // row at all — a day nobody marked attendance on is Leave, same as a
    // missed punch-out (already flagged server-side).
    const displaySessions = fillLeaveDays(allSessions, from, to, { userId: REPORT_STAFF, name: person ? person['Name'] : '', designation: person ? person['Designation'] : '', shift: person ? person['Shift Timing'] : '' });
    body.innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">
      ${statCard('Days Present', allSessions.filter(s=>s.inTime).length, rangeLabel, '🟢')}
      ${statCard('Total Hours', totalHours+'h', rangeLabel + ' (actual)', '⏱️')}
      ${statCard('Late Days', lateCount, rangeLabel, '⚠️')}
      ${statCard('Shift (reference)', person ? person['Shift Timing'] : '—', person ? person['Designation'] : '', '📍')}
    </div>
    <div class="card p-0 overflow-x-auto">
      <table><thead><tr><th>Date</th><th>IN</th><th>OUT</th><th>Hours</th><th>Status</th></tr></thead>
      <tbody>${displaySessions.length ? displaySessions.map(s => s.synthetic ? `<tr style="opacity:.7;">
        <td style="font-weight:600;">${s.dateObj.toLocaleDateString()}</td><td>—</td><td>—</td><td>—</td>
        <td><span class="pill" style="background:#fee2e2;color:#b91c1c;">Leave</span></td>
      </tr>` : `<tr>
        <td style="font-weight:600;">${s.dateObj.toLocaleDateString()}</td>
        <td>${s.inTime ? s.inTime.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '—'}</td>
        <td>${s.outTime ? s.outTime.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '—'}</td>
        <td style="font-weight:700;color:var(--orange-dark);">${s.complete ? s.hours+'h' : '—'}</td>
        <td><span class="pill ${s.inStatus==='Late'?'pill-warn':s.inTime?'pill-ok':'pill-mute'}">${s.inStatus||'Not marked'}</span>${dayStatusBadge(s.dayStatus)}</td>
      </tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:var(--ink-soft);padding:24px;">No attendance in this range.</td></tr>`}</tbody></table>
    </div>`;
    return;
  }

  // Seed every real staff member up front (not just ones with a session in
  // range) so someone with ZERO attendance this range still shows up with a
  // full Leaves count instead of silently not appearing at all.
  const byStaff = {};
  REPORTS_DATA.staff.forEach(st => {
    byStaff[st['User']] = { userId: st['User'], name: st['Name'], designation: st['Designation'], shift: st['Shift Timing'], days: 0, hours: 0, late: 0, leaves: 0, lastDate: null };
  });
  allSessions.forEach(s => {
    if (!byStaff[s.userId]) byStaff[s.userId] = { userId: s.userId, name: s.name, designation: s.designation, shift: s.shift, days: 0, hours: 0, late: 0, leaves: 0, lastDate: s.dateObj };
    if (s.inTime) byStaff[s.userId].days += 1;
    byStaff[s.userId].hours += s.hours || 0;
    if (s.inStatus === 'Late') byStaff[s.userId].late += 1;
    if (!byStaff[s.userId].lastDate || s.dateObj > byStaff[s.userId].lastDate) byStaff[s.userId].lastDate = s.dateObj;
  });
  let dateWiseRows = [];
  Object.values(byStaff).forEach(st => {
    const personSessions = allSessions.filter(s => s.userId === st.userId);
    const filled = fillLeaveDays(personSessions, from, to, st);
    st.leaves = filled.filter(f => f.dayStatus === 'Leave').length;
    dateWiseRows = dateWiseRows.concat(filled);
  });
  dateWiseRows.sort((a, b) => b.dateObj - a.dateObj || a.name.localeCompare(b.name));
  const staffRows = Object.values(byStaff).sort((a,b) => b.hours - a.hours);

  body.innerHTML = `
  <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-5">
    ${statCard('Staff Marked', staffRows.filter(r=>r.days>0).length, rangeLabel, '👥')}
    ${statCard('Total Hours', Math.round(staffRows.reduce((s,r)=>s+r.hours,0)*10)/10 + 'h', rangeLabel + ' (actual)', '⏱️')}
    ${statCard('Late Instances', staffRows.reduce((s,r)=>s+r.late,0), rangeLabel, '⚠️')}
  </div>
  <div class="card p-0 overflow-x-auto mb-5">
    <table><thead><tr><th>Staff</th><th>Designation</th><th>Days Present</th><th>Total Hours</th><th>Late Days</th><th>Leaves</th><th>Last Marked</th></tr></thead>
    <tbody>${staffRows.length ? staffRows.map(r => `<tr>
      <td style="font-weight:600;">${r.name}</td><td>${r.designation||''}</td><td>${r.days}</td>
      <td style="font-weight:700;color:var(--orange-dark);">${Math.round(r.hours*10)/10}h</td>
      <td>${r.late ? `<span class="pill pill-warn">${r.late}</span>` : '0'}</td>
      <td>${r.leaves ? `<span class="pill" style="background:#fee2e2;color:#b91c1c;">${r.leaves}</span>` : '0'}</td>
      <td>${r.lastDate ? r.lastDate.toLocaleDateString() : '—'}</td>
    </tr>`).join('') : `<tr><td colspan="7" style="text-align:center;color:var(--ink-soft);padding:24px;">No staff found.</td></tr>`}</tbody></table>
  </div>
  <div class="grid md:grid-cols-2 gap-5 mb-5">
    <div class="card p-5"><h3 style="font-size:15px;font-weight:700;margin:0 0 12px;">On Time vs Late (arrivals)</h3><canvas id="chartStatus" height="200"></canvas></div>
    <div class="card p-5"><h3 style="font-size:15px;font-weight:700;margin:0 0 12px;">Hours by staff — ${rangeLabel}</h3><canvas id="chartByStaff" height="200"></canvas></div>
  </div>
  <details class="card p-4" open>
    <summary style="cursor:pointer;font-weight:700;font-size:14px;">📋 Date-wise log, every staff member — photos &amp; map links</summary>
    <div class="overflow-x-auto mt-3">
    <table><thead><tr><th>Name</th><th>Date</th><th>IN</th><th>OUT</th><th>Hours</th><th>Status</th><th>Location</th><th>IN Photo</th><th>OUT Photo</th></tr></thead>
    <tbody>${dateWiseRows.length ? dateWiseRows.map(s => {
      if (s.synthetic) {
        return `<tr style="opacity:.7;">
        <td style="font-weight:600;">${s.name}</td><td>${s.dateObj.toLocaleDateString()}</td>
        <td>—</td><td>—</td><td>—</td>
        <td><span class="pill" style="background:#fee2e2;color:#b91c1c;">Leave</span></td>
        <td>—</td><td>—</td><td>—</td>
      </tr>`;
      }
      const mapsLink = s.inMapsLink || s.outMapsLink;
      return `<tr>
      <td style="font-weight:600;">${s.name}</td>
      <td>${s.dateObj.toLocaleDateString()}</td>
      <td><span class="pill ${s.inStatus==='Late'?'pill-warn':s.inTime?'pill-ok':'pill-mute'}">${s.inTime ? s.inTime.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '—'}</span></td>
      <td><span class="pill ${(s.outStatus==='Early Leave'||s.outStatus==='Overtime')?'pill-warn':s.outTime?'pill-ok':'pill-mute'}">${s.outTime ? s.outTime.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '—'}</span></td>
      <td style="font-weight:700;color:var(--orange-dark);">${s.complete ? s.hours+'h' : '—'}</td>
      <td style="font-size:12px;">${s.inStatus||'—'}${s.outStatus ? (' / ' + s.outStatus) : ''}${dayStatusBadge(s.dayStatus)}</td>
      <td>${mapsLink ? `<a href="${mapsLink}" target="_blank" style="color:var(--orange-dark);">View map</a>` : '—'}</td>
      <td>${photoThumb(s.inPhoto)}</td>
      <td>${photoThumb(s.outPhoto)}</td>
    </tr>`; }).join('') : `<tr><td colspan="9" style="text-align:center;color:var(--ink-soft);padding:24px;">No attendance in this range.</td></tr>`}</tbody></table>
    </div>
  </details>`;

  const statusCount = {'On Time':0,'Late':0};
  allSessions.forEach(s => { if (s.inStatus==='Late') statusCount['Late']++; else if (s.inTime) statusCount['On Time']++; });
  safeChart('chartStatus', {
    type: 'doughnut',
    data: { labels: Object.keys(statusCount), datasets: [{ data: Object.values(statusCount), backgroundColor: ['#15803D','#F59E0B'] }] },
    options: { plugins:{legend:{position:'bottom'}} }
  });
  const hoursEntries = staffRows.slice(0,10).map(r => [r.name, Math.round(r.hours*10)/10]);
  safeChart('chartByStaff', {
    type: 'bar',
    data: { labels: hoursEntries.map(e=>e[0]), datasets: [{ data: hoursEntries.map(e=>e[1]), backgroundColor:'#EA580C', borderRadius:6 }] },
    options: { indexAxis:'y', plugins:{legend:{display:false}} }
  });
}

/* ================================================================
   SUPERADMIN — Attendance Control: fix any staff member's IN/OUT for
   any date, update shift timing (also available via Staff Admin), and
   export a custom date-range CSV of everyone's day-wise attendance.
   ================================================================ */
async function renderAttendanceControl() {
  const [staffAll, attendance] = await Promise.all([api('getStaff', {}), api('getAttendance', {})]);
  if (STATE.page !== 'attcontrol') return;
  const staff = staffAll.filter(s => s['Permission'] !== 'Admin' && s['Permission'] !== 'SuperAdmin');
  window.__AC_STAFF = staff;
  window.__AC_ATTENDANCE = attendance;
  const main = document.getElementById('mainContent');
  main.innerHTML = `
  <div class="card p-5 mb-5">
    <h3 style="font-size:15px;font-weight:700;margin:0 0 4px;">Fix a Staff Member's IN / OUT</h3>
    <p style="color:var(--ink-soft);font-size:12.5px;margin:0 0 14px;">Pick anyone, pick a date, and correct their punch times directly.</p>
    <div class="grid md:grid-cols-2 gap-3 mb-3">
      <div>
        <label class="label">Staff</label>
        <select id="acStaffSelect" class="input" onchange="loadAcDay()">
          ${staff.map(s => `<option value="${s['User']}">${s['Name']} (${s['Designation']})</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="label">Date</label>
        <input id="acDate" type="date" class="input" value="${todayISO()}" onchange="loadAcDay()">
      </div>
    </div>
    <div id="acDayBody"></div>
  </div>
  <div class="card p-5 mb-5">
    <h3 style="font-size:15px;font-weight:700;margin:0 0 4px;">Everyone's IN / OUT Hours — Last 14 Days</h3>
    <div id="acAllBody" class="overflow-x-auto"></div>
  </div>
  <div class="card p-5">
    <h3 style="font-size:15px;font-weight:700;margin:0 0 4px;">Export Attendance CSV</h3>
    <p style="color:var(--ink-soft);font-size:12.5px;margin:0 0 14px;">Custom date range, all staff, day-wise IN/OUT/hours.</p>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div><label class="label">From</label><input id="csvFrom" type="date" class="input" value="${todayISO()}"></div>
      <div><label class="label">To</label><input id="csvTo" type="date" class="input" value="${todayISO()}"></div>
    </div>
    <button class="btn btn-primary w-full" onclick="exportAttendanceCSV()">⬇ Download CSV</button>
  </div>`;
  loadAcDay();
  renderAcAllTable();
}
function renderAcAllTable() {
  const el = document.getElementById('acAllBody');
  if (!el) return;
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 14); cutoff.setHours(0,0,0,0);
  const today = new Date();
  const realSessions = pairAttendance(window.__AC_ATTENDANCE || []).filter(s => s.dateObj >= cutoff);
  // Gap-fill per staff member across this same 14-day window — this is the
  // correction tool, so a day nobody marked (shown here as Leave) is exactly
  // what a SuperAdmin needs to spot and fix.
  const staffList = window.__AC_STAFF || []; // already Admin/SuperAdmin-excluded when set in renderAttendanceControl
  let sessions = [];
  staffList.forEach(st => {
    const personSessions = realSessions.filter(s => s.userId === st['User']);
    sessions = sessions.concat(fillLeaveDays(personSessions, cutoff, today, { userId: st['User'], name: st['Name'], designation: st['Designation'], shift: st['Shift Timing'] }));
  });
  sessions.sort((a, b) => b.dateObj - a.dateObj || a.name.localeCompare(b.name));
  el.innerHTML = `<table><thead><tr><th>Staff</th><th>Date</th><th>IN</th><th>OUT</th><th>Hours</th><th>Status</th><th>IN Photo</th><th>OUT Photo</th></tr></thead>
  <tbody>${sessions.length ? sessions.map(s => s.synthetic ? `<tr style="opacity:.7;">
    <td style="font-weight:600;">${s.name}</td><td>${s.dateObj.toLocaleDateString()}</td>
    <td>—</td><td>—</td><td>—</td>
    <td style="font-size:12px;"><span class="pill" style="background:#fee2e2;color:#b91c1c;">Leave</span></td>
    <td>—</td><td>—</td>
  </tr>` : `<tr>
    <td style="font-weight:600;">${s.name}</td><td>${s.dateObj.toLocaleDateString()}</td>
    <td><span class="pill ${s.inStatus==='Late'?'pill-warn':s.inTime?'pill-ok':'pill-mute'}">${s.inTime ? s.inTime.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '—'}</span>${s.inModifiedNote ? `<div style="font-size:10px;color:var(--orange-dark);font-weight:600;margin-top:2px;">✏️ modified</div>` : ''}</td>
    <td><span class="pill ${(s.outStatus==='Early Leave'||s.outStatus==='Overtime')?'pill-warn':s.outTime?'pill-ok':'pill-mute'}">${s.outTime ? s.outTime.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '—'}</span>${s.outModifiedNote ? `<div style="font-size:10px;color:var(--orange-dark);font-weight:600;margin-top:2px;">✏️ modified</div>` : ''}</td>
    <td style="font-weight:700;color:var(--orange-dark);">${s.complete ? s.hours+'h' : '—'}</td>
    <td style="font-size:12px;">${s.inStatus||'—'}${s.outStatus ? (' / '+s.outStatus) : ''}${dayStatusBadge(s.dayStatus)}</td>
    <td>${photoThumb(s.inPhoto)}</td>
    <td>${photoThumb(s.outPhoto)}</td>
  </tr>`).join('') : `<tr><td colspan="8" style="text-align:center;color:var(--ink-soft);padding:24px;">No records yet.</td></tr>`}</tbody></table>`;
}
async function loadAcDay() {
  const userId = document.getElementById('acStaffSelect').value;
  const dateISO = document.getElementById('acDate').value;
  const person = window.__AC_STAFF.find(s => s['User'] === userId);
  const body = document.getElementById('acDayBody');
  body.innerHTML = `<div class="flex justify-center py-6"><div class="spinner spinner-dark" style="width:20px;height:20px;"></div></div>`;
  const hist = await api('getAttendance', { userId });
  if (document.getElementById('acStaffSelect').value !== userId || document.getElementById('acDate').value !== dateISO) return;
  const dayRow = hist.find(r => localDateKey(r['Date']) === dateISO);
  const inTime = dayRow && dayRow['IN Time'] ? new Date(dayRow['IN Time']).toTimeString().slice(0,5) : '';
  const outTime = dayRow && dayRow['OUT Time'] ? new Date(dayRow['OUT Time']).toTimeString().slice(0,5) : '';
  body.innerHTML = `
  <div class="grid grid-cols-2 gap-3 mb-3">
    <div><label class="label">IN time</label><input id="acInTime" type="time" class="input" value="${inTime}"></div>
    <div><label class="label">OUT time</label><input id="acOutTime" type="time" class="input" value="${outTime}"></div>
  </div>
  <button class="btn btn-yellow w-full" onclick='saveAcDay(${JSON.stringify(person)}, "${dateISO}", this)'>Save Correction</button>
  `;
}
async function saveAcDay(person, dateISO, btn) {
  const inTime = document.getElementById('acInTime').value;
  const outTime = document.getElementById('acOutTime').value;
  if (!inTime && !outTime) { toast('Enter at least one time', 'error'); return; }
  if (btn) btnSaving(btn, 'Saving…');
  try {
    await api('editAttendancePunch', {
      userId: person['User'], name: person['Name'], designation: person['Designation'], shift: person['Shift Timing'],
      dateISO, inTime: inTime || undefined, outTime: outTime || undefined, editedBy: STATE.user.name,
    });
    toast('Attendance corrected ✔');
    loadAcDay();
    window.__AC_ATTENDANCE = await api('getAttendance', {});
    renderAcAllTable();
  } catch (e) { toast(e.message, 'error'); if (btn) btnRestore(btn); }
}
async function exportAttendanceCSV() {
  const from = document.getElementById('csvFrom').value;
  const to = document.getElementById('csvTo').value;
  if (!from || !to) { toast('Pick both dates', 'error'); return; }
  toast('Preparing CSV…', 'loading');
  try {
    const all = await api('getAttendance', { all: true }, { skipCache: true });
    const sessions = pairAttendance(all).filter(s => {
      const key = localDateKey(s.dateObj);
      return key >= from && key <= to;
    });
    const rows = [['Name','Designation','Date','IN','OUT','Hours','Status','Shift (reference)']];
    sessions.sort((a,b)=>a.dateObj-b.dateObj || a.name.localeCompare(b.name)).forEach(s => {
      rows.push([
        s.name, s.designation, s.dateObj.toLocaleDateString(),
        s.inTime ? s.inTime.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '',
        s.outTime ? s.outTime.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '',
        s.complete ? s.hours : '', s.inStatus || '', s.shift || '',
      ]);
    });
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `Attendance_${from}_to_${to}.csv`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    toast('CSV downloaded ✔');
  } catch (e) { toast(e.message, 'error'); }
}

/* ================================================================
   MODAL HELPERS
   ================================================================ */
function showModal(innerHtml) {
  document.getElementById('modalMount').innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">${innerHtml}<button class="btn btn-ghost w-full mt-2" onclick="closeModal()">Cancel</button></div>
  </div>`;
}
function closeModal() { document.getElementById('modalMount').innerHTML = ''; }

/* ================================================================
   PWA — real manifest.json + service worker (sw.js), both deployed
   alongside this file on Netlify. Chrome/Edge/Android get a genuine
   install prompt + offline app-shell caching; iOS uses the apple-touch-icon
   meta tags below for "Add to Home Screen".
   ================================================================ */
const PWA_ICON_URL = "https://res.cloudinary.com/dfjegeiip/image/upload/c_pad,w_180,h_180,b_rgb:FFFBF3/v1791224103/logo_n_qsftik.jpg";
(function setupPWA() {
  try {
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'manifest.json';
    document.head.appendChild(link);

    const themeMeta = document.createElement('meta');
    themeMeta.name = 'theme-color'; themeMeta.content = '#EA580C';
    document.head.appendChild(themeMeta);
    const appleCapable = document.createElement('meta');
    appleCapable.name = 'apple-mobile-web-app-capable'; appleCapable.content = 'yes';
    document.head.appendChild(appleCapable);
    const appleTitle = document.createElement('meta');
    appleTitle.name = 'apple-mobile-web-app-title'; appleTitle.content = "P Food'z Cafe";
    document.head.appendChild(appleTitle);
    const appleIcon = document.createElement('link');
    appleIcon.rel = 'apple-touch-icon'; appleIcon.href = PWA_ICON_URL;
    document.head.appendChild(appleIcon);
  } catch (e) { /* non-critical */ }
})();

// Service worker: caches the app shell for instant loads + offline
// fallback. Registered lazily after the page loads so it never delays
// first paint. Silently no-ops if sw.js 404s (e.g. testing the file
// standalone without deploying it alongside sw.js) or on http origins
// other than localhost, where SW registration isn't allowed at all.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* non-critical */ });
  });
}

/* ================================================================
   INSTALL APP — captures the browser's native install prompt (Chrome/
   Edge/Android) so the hamburger menu can trigger it on demand. iOS
   Safari never fires beforeinstallprompt (Apple doesn't support it) —
   there we show manual "Add to Home Screen" steps instead. Once a device
   has actually installed it (or is already running standalone), the
   button hides itself since there's nothing left to install.
   ================================================================ */
let DEFERRED_INSTALL_PROMPT = null;
function isStandaloneDisplay() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  DEFERRED_INSTALL_PROMPT = e;
  const btn = document.getElementById('installAppBtn');
  if (btn) btn.style.display = 'flex';
});
window.addEventListener('appinstalled', () => {
  DEFERRED_INSTALL_PROMPT = null;
  const btn = document.getElementById('installAppBtn');
  if (btn) btn.style.display = 'none';
  toast('App installed ✔');
});
function isIOSDevice() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
async function installApp() {
  if (DEFERRED_INSTALL_PROMPT) {
    DEFERRED_INSTALL_PROMPT.prompt();
    const choice = await DEFERRED_INSTALL_PROMPT.userChoice;
    DEFERRED_INSTALL_PROMPT = null;
    const btn = document.getElementById('installAppBtn');
    if (btn) btn.style.display = 'none';
    if (choice.outcome !== 'accepted') toast('Install cancelled');
    return;
  }
  if (isIOSDevice()) {
    showModal(`
      <h3 style="font-size:16px;margin:0 0 12px;">📲 Install on iPhone/iPad</h3>
      <ol style="padding-left:20px;color:var(--ink-soft);font-size:14px;line-height:1.9;margin:0;">
        <li>Tap the <b>Share</b> button in Safari's toolbar (the square with an arrow ↑).</li>
        <li>Scroll down and tap <b>"Add to Home Screen"</b>.</li>
        <li>Tap <b>Add</b> — the app icon will appear on your home screen and opens full-screen, no browser bar.</li>
      </ol>
    `);
    return;
  }
  // Chrome/Edge/Android haven't offered the native one-tap prompt yet (it
  // depends on the browser's own engagement heuristics and can take a
  // little while to appear) — give the manual path instead of doing nothing.
  showModal(`
    <h3 style="font-size:16px;margin:0 0 12px;">📲 Install this App</h3>
    <p style="color:var(--ink-soft);font-size:13px;margin:0 0 12px;">One-tap install isn't ready in this browser session yet. You can still install manually:</p>
    <ol style="padding-left:20px;color:var(--ink-soft);font-size:14px;line-height:1.9;margin:0;">
      <li><b>Android Chrome:</b> tap the <b>⋮</b> menu (top-right) → <b>"Install app"</b> or <b>"Add to Home screen"</b>.</li>
      <li><b>Desktop Chrome/Edge:</b> look for the install icon (⊕ or a small monitor) at the right end of the address bar.</li>
    </ol>
  `);
}
function updateInstallButtonVisibility() {
  const btn = document.getElementById('installAppBtn');
  if (!btn) return;
  // Always show it (unless already running as an installed app) — waiting
  // for beforeinstallprompt to decide visibility is unreliable across
  // browsers, and installApp() has a sensible fallback for every case.
  btn.style.display = isStandaloneDisplay() ? 'none' : 'flex';
}

/* ================================================================
   BOOT
   ================================================================ */
(function boot() {
  updateNetBadge();
  const saved = localStorage.getItem('pfp_user');
  if (saved) { STATE.user = JSON.parse(saved); enterApp(); }
  if (getQueue().length) setQueue(getQueue());
  setInterval(syncQueue, 20000);
  document.getElementById('loginPass')?.addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
})();
</script>
