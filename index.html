      <tbody>${items.map(i => `<tr>
        ${canManage && hasPending ? `<td>${i.status==='Pending' ? `<input type="checkbox" class="po-item-check" data-vendor="${escHtml(b.vendor)}" data-batch="${escHtml(b.batchId)}" value="${i.row}" checked>` : ''}</td>` : ''}
        <td style="font-weight:600;">${escHtml(i.name)}</td>
        <td id="poQtyCell_${i.row}" style="min-width:150px;">${poQtyCellHtml(i, canManage)}</td>
        <td style="min-width:150px;">${poNoteCellHtml(i, canManage)}</td>
        <td><span class="pill ${statusPill(i.status)}" style="font-size:10.5px;">${i.status}</span></td>
        ${canManage && hasPending ? `<td>${i.status==='Pending' ? `<button class="btn btn-ghost" style="padding:2px 8px;color:var(--red);font-size:12.5px;" onclick='removePOItem(${i.row})'>✕ Remove</button>` : ''}</td>` : ''}
      </tr>`).join('')}</tbody></table>
      </div>
      ${canManage ? `<div class="flex gap-2 mt-4">
        ${hasPending ? `<button class="btn btn-primary flex-1" onclick='generateBatch(${JSON.stringify(b.vendor)}, ${JSON.stringify(b.batchId)}, this)'>📤 Generate PO (selected)</button>` : ''}
        ${hasGenerated ? `<button class="btn btn-primary flex-1" onclick='shareBatchWhatsApp(${JSON.stringify(b.vendor)}, ${JSON.stringify(b.batchId)})'>📱 Share on WhatsApp</button>
        <button class="btn btn-outline flex-1" onclick='clearBatchConfirm(${JSON.stringify(b.vendor)}, ${JSON.stringify(b.batchId)})'>✅ Mark Cleared</button>` : ''}
        ${!hasPending && !hasGenerated && b.status==='Cleared' ? `<span style="color:var(--ink-soft);font-size:12.5px;">✅ Order placed — done. Actual stock received goes through Warehouse Stock Entry.</span>` : ''}
      </div>` : ''}
      ${canManage && hasPending ? `<p style="font-size:11px;color:var(--ink-soft);margin:8px 0 0;">Sabhi Pending items select hain by default — jo nahi chahiye unhe uncheck karo, wo is hi batch mein Pending rahenge agle Generate ke liye.</p>` : ''}
      ${canManage && (hasPending || hasGenerated) ? `<p style="font-size:11px;color:var(--ink-soft);margin:4px 0 0;">Auto PO carton mein banta hai. Extra chahiye to Qty ke neeche <b>+ add-on</b> daalo aur Enter dabao — total apne aap jud jayega. Note bhi Enter se save hota hai; WhatsApp message mein item ke aage dikhega.</p>` : ''}
    </div>`;
  }).join('');
}
// ---- PO item: Total qty (auto + add-on) + Note ----
function poFmtNum(n) { return String(Math.round((Number(n) || 0) * 1000) / 1000); }
// Total text — table aur WhatsApp dono yahi use karte hain.
// Same unit => seedha jod (10 + 2 = 12 carton); alag unit => "10 carton + 6 pcs"
function poTotalText(i) {
  const main = Number(i.qty) || 0, addon = Number(i.addonQty) || 0;
  const mu = String(i.unit || '').trim(), au = String(i.addonUnit || mu).trim();
  if (!addon) return `${poFmtNum(main)} ${mu}`.trim();
  if (au.toLowerCase() === mu.toLowerCase()) return `${poFmtNum(main + addon)} ${mu}`.trim();
  return `${poFmtNum(main)} ${mu} + ${poFmtNum(addon)} ${au}`.trim();
}
function poQtyCellHtml(i, canManage) {
  const addon = Number(i.addonQty) || 0;
  const hasAuto = i.autoQty !== '' && i.autoQty !== undefined && i.autoQty !== null;
  const detail = addon ? `<div style="font-size:11px;color:var(--ink-soft);margin-top:1px;">${hasAuto ? 'Auto' : 'Order'} ${poFmtNum(i.qty)} ${escHtml(i.unit || '')} + add-on ${poFmtNum(addon)} ${escHtml(i.addonUnit || i.unit || '')}</div>` : '';
  let edit = '';
  if (canManage && (i.status === 'Pending' || i.status === 'Generated')) {
    const p = findProductByName(i.name) || { Unit: i.unit };
    edit = `<div class="flex items-center gap-1 mt-1">
      <input id="poAdd_${i.row}" type="number" step="any" min="0" inputmode="decimal" class="input" placeholder="+ add-on" value="${addon ? poFmtNum(addon) : ''}" style="width:86px;padding:5px 8px;font-size:12.5px;border-radius:8px;" onkeydown="if(event.key==='Enter'){event.preventDefault();savePoItem(${i.row});}">
      <select id="poAddU_${i.row}" class="input" style="width:auto;padding:5px 6px;font-size:12.5px;border-radius:8px;" data-item="${escHtml(i.name)}" onchange="if(onUnitSelectChange(this)!==false)savePoItemIfAddon(${i.row})">${unitOptionsFor(p, i.addonUnit || i.unit, true, true)}</select>
      <button type="button" class="btn btn-outline" style="padding:4px 9px;font-size:12.5px;" onclick="savePoItem(${i.row})">✓</button>
    </div>`;
  }
  return `<div style="font-weight:700;color:var(--orange-dark);">${escHtml(poTotalText(i))}</div>${detail}${edit}`;
}
function poNoteCellHtml(i, canManage) {
  if (canManage && (i.status === 'Pending' || i.status === 'Generated')) {
    return `<input id="poNote_${i.row}" class="input" maxlength="200" placeholder="Note (optional)" value="${escHtml(i.note || '')}" style="padding:6px 9px;font-size:12.5px;border-radius:8px;" onkeydown="if(event.key==='Enter'){event.preventDefault();savePoItem(${i.row});}">`;
  }
  return i.note ? `<span style="font-size:12.5px;">${escHtml(i.note)}</span>` : `<span style="color:var(--ink-soft);">—</span>`;
}
function poFindItem(row) {
  for (const b of (window.__PO_BATCHES || [])) { const it = b.items.find(x => Number(x.row) === Number(row)); if (it) return it; }
  return null;
}
// Add-on / Note input mein jo likha hai wo save hone se reh to nahi gaya?
function poHasUnsaved(it) {
  const a = document.getElementById('poAdd_' + it.row), n = document.getElementById('poNote_' + it.row);
  if (!a && !n) return false;
  const addonNow = Number(a ? a.value : 0) || 0, addonOld = Number(it.addonQty) || 0;
  const noteNow = String(n ? n.value : (it.note || '')).trim(), noteOld = String(it.note || '').trim();
  return addonNow !== addonOld || noteNow !== noteOld;
}
function savePoItemIfAddon(row) { const a = document.getElementById('poAdd_' + row); if (a && Number(a.value) > 0) savePoItem(row); }
async function savePoItem(row, quiet) {
  const it = poFindItem(row); if (!it) return false;
  const a = document.getElementById('poAdd_' + row), u = document.getElementById('poAddU_' + row), n = document.getElementById('poNote_' + row);
  const addonQty = Number(a ? a.value : 0) || 0;
  if (addonQty < 0) { toast('Add-on negative nahi ho sakta', 'error'); return false; }
  const payload = { row: Number(row), addonQty, addonUnit: addonQty > 0 ? (u ? u.value : it.unit) : '', itemNote: n ? n.value.trim() : (it.note || '') };
  try {
    const r = await api('updatePOItem', payload);
    it.addonQty = addonQty > 0 ? addonQty : '';
    it.addonUnit = addonQty > 0 ? payload.addonUnit : '';
    it.note = payload.itemNote;
    const cell = document.getElementById('poQtyCell_' + row);
    if (cell) cell.innerHTML = poQtyCellHtml(it, true);
    if (!quiet) toast(addonQty > 0 ? `Total: ${poTotalText(it)} ✔` : 'Save ho gaya ✔');
    const nn = document.getElementById('poNote_' + row); if (nn) nn.value = it.note;
    return true;
  } catch (e) { toast(e.message, 'error'); return false; }
}
// Batch ke un items ko save karo jinke add-on / note abhi tak Enter se save nahi hue
async function flushPoEdits(items) {
  let any = false;
  for (const it of items) { if (poHasUnsaved(it)) { any = true; const ok = await savePoItem(it.row, true); if (!ok) return { any, ok: false }; } }
  return { any, ok: true };
}
function togglePoBatchSelectAll(headerCb, vendor, batchId) {
  document.querySelectorAll(`.po-item-check[data-vendor="${vendor}"][data-batch="${batchId}"]`).forEach(cb => { cb.checked = headerCb.checked; });
}
async function generateBatch(vendor, batchId, btn) {
  const checked = Array.from(document.querySelectorAll(`.po-item-check[data-vendor="${vendor}"][data-batch="${batchId}"]:checked`)).map(cb => Number(cb.value));
  if (!checked.length) { toast('Kam se kam ek item select karo', 'error'); return; }
  if (btn) btnSaving(btn, 'Generating PDF…'); // this one also builds a PDF server-side, so it's genuinely slower than a plain save
  try {
    const bb = (window.__PO_BATCHES || []).find(x => x.vendor === vendor && x.batchId === batchId);
    if (bb) { const f = await flushPoEdits(bb.items.filter(i => i.status !== 'Cancelled')); if (!f.ok) { if (btn) btnRestore(btn); return; } }
    const r = await api('generatePOBatch', { vendor, batchId, rows: checked });
    toast(`PO generated — ${r.itemCount} item(s) ✔${r.remainingPending ? ` (${r.remainingPending} baaki batch mein pending hai)` : ''}`);
    goTo('po');
  } catch (e) { toast(e.message, 'error'); if (btn) btnRestore(btn); }
}
async function shareBatchWhatsApp(vendor, batchId) {
  const batches = window.__PO_BATCHES || [];
  const b = batches.find(x => x.vendor === vendor && x.batchId === batchId);
  if (!b) return;
  // Only the items actually Generated (ordered) go on the WhatsApp share —
  // any still-Pending items in this same batch (left unchecked on purpose,
  // waiting for a future Generate) haven't been ordered yet and must not
  // appear on a PO message that's about to be sent to the vendor.
  const items = b.items.filter(i => i.status === 'Generated');
  // Add-on / Note likha hua par Enter nahi dabaya? Pehle save karo, phir dobara Share dabao
  // (network ke baad window.open mobile par popup-block ho jata hai, isliye yahin rok dete hain).
  const f = await flushPoEdits(items);
  if (!f.ok) return;
  if (f.any) { toast('Add-on / Note save ho gaye ✔ — ab dobara "Share on WhatsApp" dabao'); return; }
  // Ek item = ek line:  1. Item Name — Total Qty Unit — Note
  const lines = items.map((i, idx) => `${idx+1}. *${i.name}* — ${poTotalText(i)}${i.note ? ` — 📝 Note: ${i.note}` : ''}`);
  const text = `*Purchase Order — ${vendor}*\nBatch: ${batchId}\n\n${lines.join('\n')}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}
function clearBatchConfirm(vendor, batchId) {
  // confirmDialog's own OK button is gone by the time this runs (it closes
  // itself before calling back), so there's no button left to show a
  // saving state on — a non-auto-dismissing loading toast fills that gap.
  confirmDialog('Mark this PO as cleared?', `${vendor} — Batch ${batchId}. This closes the order; a fresh batch will start automatically for future low-stock items.`, async () => {
    const t = toast('Saving…', 'loading');
    try { await api('clearPOBatch', { vendor, batchId }); t.remove(); toast('PO cleared ✔'); goTo('po'); }
    catch (e) { t.remove(); toast(e.message, 'error'); }
  });
}
async function removePOItem(row) {
  const t = toast('Saving…', 'loading');
  try { await api('cancelPO', { row }); t.remove(); toast('Item removed from PO'); goTo('po'); }
  catch (e) { t.remove(); toast(e.message, 'error'); }
}
// Rapid multi-add: pick an item, enter qty, tap Add — the modal stays open
// with the form cleared and refocused so you can keep adding the next item
// straight away, like building a shopping list. A running "Added" list
// shows progress; Done just closes and refreshes the PO page.
let PO_SESSION_ADDS = [];
function openCreatePO(preselectName) {
  // A fresh open starts a clean session; resuming after "+ Add New Item"
  // (which closes/reopens this modal) must NOT wipe items already added.
  if (!preselectName) PO_SESSION_ADDS = [];

  showModal(`
    <h3 style="font-size:16px;margin:0 0 4px;">Add Items to Purchase Order</h3>
    <p style="color:var(--ink-soft);font-size:12.5px;margin:0 0 14px;">Pick an item, enter qty, tap Add — keep going for as many items as you need, they'll join that vendor's open PO batch automatically.</p>
    ${vendors.length ? `<label class="label">Filter by vendor (optional)</label>
    <select id="poVendorFilter" class="input mb-3" onchange="onPoVendorFilterChange()">
      <option value="">All items</option>
      ${vendors.map(v => `<option value="${v}">${v}</option>`).join('')}

      <label class="label" style="margin:0;">Item</label>
      ${isHero() ? `<button type="button" class="btn btn-outline" style="padding:3px 10px;font-size:11.5px;" onclick="openAddNewItemModal(p => openCreatePO(p['Item Name (Standardized)']))">+ Add New Item</button>` : ''}
    </div>

    <div id="poItemMeta" style="font-size:12.5px;color:var(--ink-soft);margin:6px 0 10px;"></div>
    <div id="poUnitWrap" style="display:none;"><label class="label">Unit</label><select id="poUnit" class="input mb-3"></select></div>
    <label class="label">Quantity to order</label><input id="poQty" type="number" step="any" min="0" inputmode="decimal" class="input mb-3" placeholder="0">
    <label class="label">Note (optional)</label><input id="poNote" class="input mb-3" maxlength="200" placeholder="Jaise: lal pack wala / sirf 5 kg wala…">
    <button class="btn btn-primary w-full mb-4" onclick="submitPO(this)">+ Add to PO</button>
    <div id="poSessionList" style="font-size:12.5px;color:var(--ink-soft);"></div>
  `);
  acInit('poItemInput', STATE.products.map(p=>p['Item Name (Standardized)']), onPoItemPick, null);
  if (preselectName) onPoItemPick(preselectName);

}
// Item chunte hi uska unit dropdown (item ke apne Unit / Base Unit) apne aap aa jata hai — naya unit banane ka option nahi.
// Default carton / pkt (Base Unit) hai, chhota unit (pcs) bhi dropdown mein milega.
function onPoItemPick(val) {
  val = val !== undefined ? val : ((document.getElementById('poItemInput') || {}).value || '');
  const match = findProductByName(val);
  const meta = document.getElementById('poItemMeta'), wrap = document.getElementById('poUnitWrap'), sel = document.getElementById('poUnit');
  if (!meta || !wrap || !sel) return;
  if (!match) { meta.innerHTML = ''; wrap.style.display = 'none'; sel.innerHTML = ''; sel.dataset.item = ''; return; }
  const sm = stockPackSummary(match);
  const mn = match['Min'] === '' || match['Min'] === undefined ? '—' : match['Min'], mx = match['Max'] === '' || match['Max'] === undefined ? '—' : match['Max'];
  meta.innerHTML = `Current stock: <b>${escHtml(sm.text)}</b> &nbsp;•&nbsp; Min / Max: <b>${escHtml(String(mn))} / ${escHtml(String(mx))}</b> ${escHtml(match['Unit'] || '')}`;
  wrap.style.display = 'block';
  const name = match['Item Name (Standardized)'];
  if (sel.dataset.item !== name) {
    const base = String(match[PROD_FIELD.BASEUNIT] || '').trim();
    const nat = String(match['Unit'] || '').trim();
    sel.innerHTML = unitOptionsFor(match, (base && base.toLowerCase() !== nat.toLowerCase()) ? base : nat, false, false);
    sel.dataset.item = name;
  }
}
function onPoVendorFilterChange() {
  const vendor = document.getElementById('poVendorFilter').value;
  const items = (vendor ? STATE.products.filter(p => p['Vendor'] === vendor) : STATE.products).map(p=>p['Item Name (Standardized)']);
  acInit('poItemInput', items, onPoItemPick, null);
  document.getElementById('poItemInput').value = '';
  onPoItemPick('');
}
function renderPoSessionList() {
  const el = document.getElementById('poSessionList');
  if (!el) return;
  if (!PO_SESSION_ADDS.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<div style="font-weight:600;color:var(--ink);margin-bottom:6px;">Added this session:</div>` +
    PO_SESSION_ADDS.map(a => `<div class="flex justify-between py-1" style="border-bottom:1px solid var(--line);">
      <span>${a.name}</span><span>${a.qty} ${a.unit}</span>
    </div>`).join('') +
    `<button class="btn btn-outline w-full mt-3" onclick="closeModal(); goTo('po');">✅ Done — Back to Purchase Orders</button>`;
}
async function submitPO(btn) {
  const itemName = document.getElementById('poItemInput').value.trim();
  const match = findProductByName(itemName);
  const qty = Number(document.getElementById('poQty').value);
  const unitEl = document.getElementById('poUnit');
  const unit = (unitEl && unitEl.value) || (match && match['Unit']) || '';
  const itemNote = (document.getElementById('poNote') || {}).value || '';
  if (!match) { toast('Pick a valid existing item from the list', 'error'); return; }
  if (!unit) { toast('Unit chuno', 'error'); return; }
  if (!qty || qty <= 0) { toast('Enter a quantity', 'error'); return; }
  btnSaving(btn, 'Saving…');
  try {
    await api('addPurchaseOrder', { itemName: match['Item Name (Standardized)'], category: match['Category'], unit, qty, itemNote: itemNote.trim(), requestedBy: STATE.user.name });
    PO_SESSION_ADDS.push({ name: match['Item Name (Standardized)'], qty, unit });
    toast(`${match['Item Name (Standardized)']} added ✔`);
    document.getElementById('poItemInput').value = '';
    document.getElementById('poQty').value = '';
    const ne = document.getElementById('poNote'); if (ne) ne.value = '';
    onPoItemPick('');
    renderPoSessionList();
    document.getElementById('poItemInput').focus();
  } catch (e) { toast(e.message, 'error'); }
  finally { btnRestore(btn); }
}

async function saveItemForm(row, btn) {
  const g = id => String((document.getElementById(id) || {}).value === undefined ? '' : document.getElementById(id).value).trim();
  const vendor = g('ifVendor');
  const fields = {
    name: g('ifName'), category: g('ifCat'), packaging: g('ifPack'), unit: g('ifUnit'), baseUnit: g('ifBase') || g('ifUnit'),
    suq: g('ifSuq') || '1', stockType: g('ifType'), openFull: g('ifOpenFull') || '0', openLoose: g('ifOpenLoose') || '0',
    purchase: g('ifPurchase') || '0', approved: g('ifApproved') || '0', demand: g('ifDemand') || '0',
    min: g('ifMin'), max: g('ifMax'), rate: g('ifRate'), rateUnit: g('ifRateUnit') || g('ifUnit'),
    expiry: g('ifExpiry'), vendor: vendor === '__add_new__' ? '' : vendor, extraUnits: g('ifExtra'),
  };
  const badX = g('ifExtra').split(/[,;]+/).map(x => x.trim()).filter(Boolean).filter(x => !/^[^=:]+[=:]\s*\d*\.?\d+$/.test(x));
  if (badX.length) { toast('Extra Units aise likho: box=12, tray=30 — galat: ' + badX.join(', '), 'error'); return; }
  if (!fields.name) { toast('Item ka naam likho', 'error'); return; }
  if (!fields.category || !fields.unit) { toast('Category aur Unit dono bharo', 'error'); return; }
  if (!(Number(fields.suq) > 0)) { toast('"1 Base Unit = kitne Unit" 0 se zyada hona chahiye', 'error'); return; }
  const dup = findProductByName(fields.name);
  if (dup && dup._row !== row) { toast('Is naam ka item pehle se hai', 'error'); return; }
  btnSaving(btn, 'Saving…');
  try {
    const r = await api('heroSaveProduct', { row: row || null, originalName: row ? (window.__IF_ORIG || '') : '', fields });
    if (r && r.product) applyServerProduct(r.product);
    invalidateApiCache('getProducts'); invalidateApiCache('getVendors');
    STATE.categories = distinctFieldValues('Category');
    api('getRateHistory', {}, { skipCache: true }).then(h => { STATE.rateHistory = h || []; }).catch(() => {});
    toast(row ? 'Item update ho gaya ✔' : `${fields.name} ban gaya ✔`);
    closeModal();
    const cb = window.__onItemSaved; window.__onItemSaved = null;
    if (cb && r && r.product) cb(r.product);
    else if (STATE.page === 'items') refreshItemsTable();
    else rerenderCurrent();
  } catch (e) { toast(e.message, 'error'); btnRestore(btn); }
}

const SALES = { mode: 'today', from: null, to: null, data: null, timer: null, chart: null, chart2: null, chFilter: 'all', itemQ: '', orderQ: '', loading: false };
function canSeeSales() { return !!(STATE.user && ['Admin', 'Hero', 'Viewer'].includes(STATE.user.permission)); }
function salesBounds() {

  if (SALES.mode === 'yday') { const y = new Date(now); y.setDate(now.getDate() - 1); const k = localDateKey(y); return [k, k, 'Kal']; }
  if (SALES.mode === 'week') { const s = new Date(now); s.setDate(now.getDate() - 6); return [localDateKey(s), todayISO(), 'Pichhle 7 din']; }
  if (SALES.mode === 'month') return [localDateKey(new Date(now.getFullYear(), now.getMonth(), 1)), todayISO(), 'Is mahina'];
  return [SALES.from || todayISO(), SALES.to || todayISO(), `${SALES.from || '…'} se ${SALES.to || '…'}`];
}
async function renderSales() {

  const b = (m, t) => `<button class="btn ${SALES.mode === m ? 'btn-primary' : 'btn-outline'}" style="padding:9px 14px;font-size:13.5px;" onclick="setSalesRange('${m}')">${t}</button>`;

        <button class="btn btn-yellow" style="padding:9px 14px;font-size:13.5px;" onclick="applySalesCustom()">Dikhao</button>` : ''}

function setSalesRange(mode) {
  SALES.mode = mode;
  if (mode === 'custom' && !SALES.from) { const c = new Date(); c.setDate(c.getDate() - 6); SALES.from = localDateKey(c); SALES.to = todayISO(); }
  SALES.data = null; renderSales();
}
function applySalesCustom() {
  SALES.from = document.getElementById('salesFrom').value || todayISO();
  SALES.to = document.getElementById('salesTo').value || SALES.from;
  if (SALES.from > SALES.to) { const t = SALES.from; SALES.from = SALES.to; SALES.to = t; }
  const days = (new Date(SALES.to) - new Date(SALES.from)) / 86400000;
  if (days > 61) { alert('Ek baar mein max 62 din'); return; }

    if (STATE.page !== 'sales') { clearInterval(SALES.timer); return; }

async function loadSales(force, silent) {

function drawSalesChart(single) {
  try { if (SALES.chart) SALES.chart.destroy(); } catch (e) {}
  const s = SALES.data.summary;
  let labels, vals, cnt;
  if (single) {
    const hrs = s.byHour.filter(h => h.orders > 0);
    const lo = hrs.length ? hrs[0].hour : 9, hi = hrs.length ? hrs[hrs.length - 1].hour : 22;
    const rng = s.byHour.filter(h => h.hour >= lo && h.hour <= hi);
    labels = rng.map(h => { const x = h.hour % 12 || 12; return x + (h.hour < 12 ? 'am' : 'pm'); });
    vals = rng.map(h => h.amount); cnt = rng.map(h => h.orders);
  } else {
    labels = s.byDay.map(x => new Date(x.date + 'T00:00:00').toLocaleDateString([], { day: 'numeric', month: 'short' }));
    vals = s.byDay.map(x => x.amount); cnt = s.byDay.map(x => x.orders);
  }
  SALES.chart = safeChart('salesChart', {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Sales ₹', data: vals, backgroundColor: '#EA580C', borderRadius: 6 }] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false },
      tooltip: { callbacks: { label: (c) => `${inr(c.raw)} · ${cnt[c.dataIndex]} orders` } } },
      scales: { y: { beginAtZero: true, ticks: { callback: (v) => '₹' + Number(v).toLocaleString('en-IN') } } } },
  });
}

function normDateForInput(v) {
  if (!v) return '';

async function approveItemReq(row, reqId, btn) {

  const fields = { name: v('irqName'), category: v('irqCat'), unit: v('irqUnit'), stockType: v('irqType'), rate: v('irqRate'), expiry: v('irqExp'), qty: v('irqQty'), note: v('irqNote'), makeEntry: !!(document.getElementById('irqEntry' + row) || {}).checked };

  if (!fields.category || !fields.unit) { toast('Category aur Unit dono bharo', 'error'); return; }
  btnSaving(btn, 'Approve ho raha hai…');
  try {
    const r = await api('approveItemRequest', { row, reqId, fields });
    if (r.product) applyServerProduct(r.product);
    invalidateApiCache('getProducts'); invalidateApiCache('getItemRequests'); invalidateApiCache('getDemands');
    toast(`✔ "${r.itemName}" ${r.created ? 'list mein add ho gaya' : '(pehle se tha) approve'}${r.entry ? ' + ' + (r.forType === 'Demand' ? 'demand' : 'entry') + ' ban gayi' : ''}`);
    if (r.entryError) toast('Item ban gaya, par entry nahi hui: ' + r.entryError, 'error');

  } catch (e) { toast(e.message, 'error'); btnRestore(btn); }
}
async function rejectItemReq(row, reqId, btn) {

  btnSaving(btn, 'Reject…');
  try {
    await api('rejectItemRequest', { row, reqId, note });
    invalidateApiCache('getItemRequests');
    toast('Request reject kar di');
    renderItemRequests();
  } catch (e) { toast(e.message, 'error'); btnRestore(btn); }
}

  if (mode === 'custom' && !CYL.from) {
    const c = new Date(); c.setDate(1);
    CYL.from = localDateKey(c); CYL.to = todayISO();
  }
  drawCylRangeBar();
  renderCylReportBody();
}
function applyCylCustom() {
  CYL.from = document.getElementById('cylFrom').value || null;
  CYL.to = document.getElementById('cylTo').value || null;
  if (CYL.from && CYL.to && CYL.from > CYL.to) { const t = CYL.from; CYL.from = CYL.to; CYL.to = t; drawCylRangeBar(); }
  renderCylReportBody();
}
// Returns { from: Date|null, to: Date|null (exclusive), label }
function cylBounds() {
  const now = new Date();
  if (CYL.mode === 'today') {
    const f = new Date(now); f.setHours(0,0,0,0);
    return { from: f, to: null, label: 'Today' };
  }
  if (CYL.mode === 'week') {
    const f = new Date(now); f.setDate(now.getDate() - now.getDay()); f.setHours(0,0,0,0);
    return { from: f, to: null, label: 'This Week' };
  }
  if (CYL.mode === 'month') {
    return { from: new Date(now.getFullYear(), now.getMonth(), 1), to: null, label: 'This Month' };
  }
  if (CYL.mode === 'lastmonth') {
    const f = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const t = new Date(now.getFullYear(), now.getMonth(), 1);
    return { from: f, to: t, label: f.toLocaleString('en-IN', { month: 'long', year: 'numeric' }) };
  }
  // custom
  let f = null, t = null;
  if (CYL.from) { const p = CYL.from.split('-').map(Number); f = new Date(p[0], p[1] - 1, p[2], 0, 0, 0, 0); }
  if (CYL.to) { const p = CYL.to.split('-').map(Number); t = new Date(p[0], p[1] - 1, p[2] + 1, 0, 0, 0, 0); }
  const fmt = (k) => { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); };
  const label = (CYL.from && CYL.to) ? (CYL.from === CYL.to ? fmt(CYL.from) : fmt(CYL.from) + ' – ' + fmt(CYL.to)) : 'Custom';
  return { from: f, to: t, label };
}
function renderCylReportBody() {
  const bd = cylBounds();
  const entries = (window.__CYL_ENTRIES || []).filter(e => {
    const ts = new Date(e['Timestamp']);
    if (isNaN(ts.getTime())) return false;
    if (bd.from && ts < bd.from) return false;
    if (bd.to && ts >= bd.to) return false;
    return true;
  });
  const totalCylinders = entries.reduce((s,e) => s + (Number(e['Qty'])||0), 0);
  const totalAmount = entries.reduce((s,e) => s + (Number(e['Total Amount'])||0), 0);

    ${statCard('Total Amount', '₹' + totalAmount.toLocaleString('en-IN'), bd.label, '💰')}
  </div>
  <div class="card p-0 overflow-x-auto">
    <table><thead><tr><th>Time</th><th>Received By</th><th>Qty</th><th>Price</th><th>Total</th><th>Photo</th></tr></thead>

      <td style="font-weight:600;">${e['Received By']}</td>

}

// Local calendar-day key (yyyy-MM-dd) using the BROWSER's local timezone —
// avoids the UTC-offset day-shift bug that toISOString() has near midnight.
function localDateKey(d) {
  d = d instanceof Date ? d : new Date(d);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayISO() { return localDateKey(new Date()); }
// Canteen staff work an 8 AM – 3 AM (next day) shift — matches
// businessDateKey() in Code.gs exactly. A punch between midnight and 3 AM
// still belongs to the PREVIOUS calendar day's shift, so an overnight
// IN→OUT pair (e.g. 8 AM to 1 AM, a 17-hour duty) stays attributed to the
// one day it started on instead of being split across two calendar dates.
function businessDayKeyOf(d) {
  d = d instanceof Date ? new Date(d) : new Date(d);
  if (d.getHours() < 3) d.setDate(d.getDate() - 1);
  return localDateKey(d);
}
function currentBusinessDayKey() { return businessDayKeyOf(new Date()); }
function setReportRange(mode) {
  REPORT_RANGE.mode = mode;
  if (mode !== 'custom') renderReports(); else { REPORT_RANGE.from = todayISO(); REPORT_RANGE.to = todayISO(); renderReports(); }
}
function applyCustomRange() {
  REPORT_RANGE.from = document.getElementById('repFrom').value;
  REPORT_RANGE.to = document.getElementById('repTo').value;
  renderReportsBody();
}
function onReportStaffChange(userId) {
  REPORT_STAFF = userId;
  renderReportsBody();
}
function rangeBounds() {
  const now = new Date();
  if (REPORT_RANGE.mode === 'today') {
    const s = new Date(now); s.setHours(0,0,0,0);
    const e = new Date(now); e.setHours(23,59,59,999);
    return [s, e];
  }
  if (REPORT_RANGE.mode === 'week') {
    const day = now.getDay();
    const s = new Date(now); s.setDate(now.getDate() - day); s.setHours(0,0,0,0);
    const e = new Date(now); e.setHours(23,59,59,999);
    return [s, e];
  }
  const s = new Date(REPORT_RANGE.from + 'T00:00:00');
  const e = new Date(REPORT_RANGE.to + 'T23:59:59');
  return [s, e];
}
function renderReportsBody() {
  const [from, to] = rangeBounds();
  const rangeLabel = REPORT_RANGE.mode==='today' ? 'Today' : REPORT_RANGE.mode==='week' ? 'This Week' : `${REPORT_RANGE.from} to ${REPORT_RANGE.to}`;
  const filteredRows = REPORT_STAFF==='all' ? REPORTS_DATA.attendance : REPORTS_DATA.attendance.filter(a => a['User ID']===REPORT_STAFF);
  const allSessions = pairAttendance(filteredRows).filter(s => s.dateObj >= new Date(from.toDateString()) && s.dateObj <= to);
  const body = document.getElementById('reportsBody');
  if (!body) return;

  if (REPORT_STAFF !== 'all') {
    const person = REPORTS_DATA.staff.find(s => s['User']===REPORT_STAFF);
    const totalHours = Math.round(allSessions.reduce((s,x)=>s+(x.hours||0),0)*10)/10;
    const lateCount = allSessions.filter(s=>s.inStatus==='Late').length;
    // Fill every day in the selected range with Leave where there's no real
    // row at all — a day nobody marked attendance on is Leave, same as a
    // missed punch-out (already flagged server-side).
    const displaySessions = fillLeaveDays(allSessions, from, to, { userId: REPORT_STAFF, name: person ? person['Name'] : '', designation: person ? person['Designation'] : '', shift: person ? person['Shift Timing'] : '' });
    body.innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">
      ${statCard('Days Present', allSessions.filter(s=>s.inTime).length, rangeLabel, '🟢')}
      ${statCard('Total Hours', totalHours+'h', rangeLabel + ' (actual)', '⏱️')}
      ${statCard('Late Days', lateCount, rangeLabel, '⚠️')}
      ${statCard('Shift (reference)', person ? person['Shift Timing'] : '—', person ? person['Designation'] : '', '📍')}
    </div>
    <div class="card p-0 overflow-x-auto">
      <table><thead><tr><th>Date</th><th>IN</th><th>OUT</th><th>Hours</th><th>Status</th></tr></thead>
      <tbody>${displaySessions.length ? displaySessions.map(s => s.synthetic ? `<tr style="opacity:.7;">
        <td style="font-weight:600;">${s.dateObj.toLocaleDateString()}</td><td>—</td><td>—</td><td>—</td>
        <td><span class="pill" style="background:#fee2e2;color:#b91c1c;">Leave</span></td>
      </tr>` : `<tr>
        <td style="font-weight:600;">${s.dateObj.toLocaleDateString()}</td>
        <td>${s.inTime ? formatTimeWithDate(s.inTime) : '—'}</td>
        <td>${s.outTime ? formatTimeWithDate(s.outTime) : '—'}</td>
        <td style="font-weight:700;color:var(--orange-dark);">${s.complete ? s.hours+'h' : '—'}</td>
        <td><span class="pill ${s.inStatus==='Late'?'pill-warn':s.inTime?'pill-ok':'pill-mute'}">${s.inStatus||'Not marked'}</span>${dayStatusBadge(s.dayStatus)}</td>
      </tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:var(--ink-soft);padding:24px;">No attendance in this range.</td></tr>`}</tbody></table>
    </div>`;
    return;
  }

  // Seed every real staff member up front (not just ones with a session in
  // range) so someone with ZERO attendance this range still shows up with a
  // full Leaves count instead of silently not appearing at all.
  const byStaff = {};
  REPORTS_DATA.staff.forEach(st => {
    byStaff[st['User']] = { userId: st['User'], name: st['Name'], designation: st['Designation'], shift: st['Shift Timing'], days: 0, hours: 0, late: 0, leaves: 0, lastDate: null };
  });
  allSessions.forEach(s => {
    if (!byStaff[s.userId]) byStaff[s.userId] = { userId: s.userId, name: s.name, designation: s.designation, shift: s.shift, days: 0, hours: 0, late: 0, leaves: 0, lastDate: s.dateObj };
    if (s.inTime) byStaff[s.userId].days += 1;
    byStaff[s.userId].hours += s.hours || 0;
    if (s.inStatus === 'Late') byStaff[s.userId].late += 1;
    if (!byStaff[s.userId].lastDate || s.dateObj > byStaff[s.userId].lastDate) byStaff[s.userId].lastDate = s.dateObj;
  });
  let dateWiseRows = [];
  Object.values(byStaff).forEach(st => {
    const personSessions = allSessions.filter(s => s.userId === st.userId);
    const filled = fillLeaveDays(personSessions, from, to, st);
    st.leaves = filled.filter(f => f.dayStatus === 'Leave').length;
    dateWiseRows = dateWiseRows.concat(filled);
  });
  dateWiseRows.sort((a, b) => b.dateObj - a.dateObj || a.name.localeCompare(b.name));
  const staffRows = Object.values(byStaff).sort((a,b) => b.hours - a.hours);

  body.innerHTML = `
  <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-5">
    ${statCard('Staff Marked', staffRows.filter(r=>r.days>0).length, rangeLabel, '👥')}

    <summary style="cursor:pointer;font-weight:700;font-size:14px;">📋 Date-wise log, every staff member — photos &amp; map links</summary>
    <div class="overflow-x-auto mt-3">
    <table><thead><tr><th>Name</th><th>Date</th><th>IN</th><th>OUT</th><th>Hours</th><th>Status</th><th>Location</th><th>IN Photo</th><th>OUT Photo</th></tr></thead>

      <td><span class="pill ${s.inStatus==='Late'?'pill-warn':s.inTime?'pill-ok':'pill-mute'}">${s.inTime ? formatTimeWithDate(s.inTime) : '—'}</span></td>
      <td><span class="pill ${(s.outStatus==='Early Leave'||s.outStatus==='Overtime')?'pill-warn':s.outTime?'pill-ok':'pill-mute'}">${s.outTime ? formatTimeWithDate(s.outTime) : '—'}</span></td>

    </div>
  </details>`;

  const statusCount = {'On Time':0,'Late':0};
  allSessions.forEach(s => { if (s.inStatus==='Late') statusCount['Late']++; else if (s.inTime) statusCount['On Time']++; });

async function exportAttendanceCSV() {
  const from = document.getElementById('csvFrom').value;
  const to = document.getElementById('csvTo').value;
  if (!from || !to) { toast('Pick both dates', 'error'); return; }
  toast('Preparing CSV…', 'loading');
  try {
    const all = await api('getAttendance', { all: true }, { skipCache: true });
    const sessions = pairAttendance(all).filter(s => {
      const key = localDateKey(s.dateObj);
      return key >= from && key <= to;
    });
    const rows = [['Name','Designation','Date','IN','OUT','Hours','Status','Shift (reference)']];
    sessions.sort((a,b)=>a.dateObj-b.dateObj || a.name.localeCompare(b.name)).forEach(s => {
      rows.push([
        s.name, s.designation, s.dateObj.toLocaleDateString(),
        s.inTime ? s.inTime.toLocaleString('en-GB', {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '',
        s.outTime ? s.outTime.toLocaleString('en-GB', {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '',
        s.complete ? s.hours : '', s.inStatus || '', s.shift || '',
      ]);
    });
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `Attendance_${from}_to_${to}.csv`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    toast('CSV downloaded ✔');
  } catch (e) { toast(e.message, 'error'); }
}

let AR = { mode: 'month', from: null, to: null, staff: 'all' };

  else if (mode === 'today') { AR.from = todayISO(); AR.to = todayISO(); }

function arQuick(m) { if (m !== 'custom') arSetQuick(m); else AR.mode = 'custom'; renderAttReport(); }
function arChange() {
  AR.from = document.getElementById('arFrom').value || AR.from;
  AR.to = document.getElementById('arTo').value || AR.to;
  if (AR.from > AR.to) { const t = AR.from; AR.from = AR.to; AR.to = t; }

// Ek staff ke har din ka hisaab (koi punch nahi = Leave; IN hua par OUT nahi aur 3 baje auto-Leave = Leave)
function arCompute() {
  const from = new Date(AR.from + 'T00:00:00'), to = new Date(AR.to + 'T00:00:00');
  const totalDays = Math.round((to - from) / 86400000) + 1;
  const staff = window.__AR_STAFF.filter(s => AR.staff === 'all' || s['User'] === AR.staff);
  const people = staff.map(st => {
    const uid = String(st['User']).toLowerCase().trim();
    const rows = window.__AR_ATT.filter(r => String(r['User ID'] || '').toLowerCase().trim() === uid);
    const sessions = pairAttendance(rows).filter(s => { const k = localDateKey(s.dateObj); return k >= AR.from && k <= AR.to; });
    const days = fillLeaveDays(sessions, from, to, { userId: st['User'], name: st['Name'], designation: st['Designation'], shift: st['Shift Timing'] })
      .sort((a, b) => a.dateObj - b.dateObj);
    const sum = { present: 0, full: 0, outMissing: 0, leaves: 0, late: 0, early: 0, overtime: 0, hours: 0 };
    days.forEach(d => {
      d.kind = d.synthetic ? 'Leave' : (d.dayStatus === 'Leave' ? 'Leave (OUT nahi)' : (d.inTime && d.complete ? 'Present' : (d.inTime ? 'Present (OUT baaki)' : 'Leave')));
      if (d.kind.startsWith('Leave')) sum.leaves++; else sum.present++;
      if (d.complete) { sum.full++; sum.hours += d.hours || 0; }
      if (d.inTime && !d.outTime) sum.outMissing++;
      if (d.inStatus === 'Late') sum.late++;
      if (d.outStatus === 'Early Leave') sum.early++;
      if (d.outStatus === 'Overtime') sum.overtime++;
    });
    sum.hours = Math.round(sum.hours * 10) / 10;
    sum.avg = sum.full ? Math.round(sum.hours / sum.full * 10) / 10 : 0;
    return { st, days, sum };
  });
  const T = { staff: people.length, present: 0, leaves: 0, full: 0, outMissing: 0, late: 0, early: 0, hours: 0 };
  people.forEach(p => { ['present', 'leaves', 'full', 'outMissing', 'late', 'early', 'hours'].forEach(k => T[k] += p.sum[k]); });
  T.hours = Math.round(T.hours * 10) / 10;
  return { totalDays, people, T };
}

function rcInRange(t) { const d = new Date(t); if (isNaN(d.getTime())) return false; const k = localDateKey(d); return k >= RC.from && k <= RC.to; }

const PWA_ICON_URL = "https://res.cloudinary.com/dfjegeiip/image/upload/c_pad,w_180,h_180,b_rgb:FFFBF3/v1791224103/logo_n_qsftik.png";
(function setupPWA() {
  try {
    if (document.querySelector('link[rel="manifest"]')) return; // ab head mein pehle se hai
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'manifest.json';
    document.head.appendChild(link);

    const themeMeta = document.createElement('meta');

    document.head.appendChild(appleTitle);

// Service worker: caches the app shell for instant loads + offline
// fallback. Registered lazily after the page loads so it never delays
// first paint. Silently no-ops if sw.js 404s (e.g. testing the file
// standalone without deploying it alongside sw.js) or on http origins
// other than localhost, where SW registration isn't allowed at all.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
      reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => { /* non-critical */ });
    let _swReloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (_swReloaded) return; _swReloaded = true;
      const busy = document.getElementById('modalMount').innerHTML.trim() !== '' || (document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName));

   Safari never fires beforeinstallprompt (Apple doesn't support it) —
   there we show manual "Add to Home Screen" steps instead. Once a device
   has actually installed it (or is already running standalone), the
   button hides itself since there's nothing left to install.
   ================================================================ */
let DEFERRED_INSTALL_PROMPT = null;
function isStandaloneDisplay() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  DEFERRED_INSTALL_PROMPT = e;
  updateInstallButtonVisibility();
});
window.addEventListener('appinstalled', () => {
  DEFERRED_INSTALL_PROMPT = null;
  const b1 = document.getElementById('installAppBtn'); if (b1) b1.style.display = 'none';
  const b2 = document.getElementById('installAppBtnLogin'); if (b2) b2.style.display = 'none';
  toast('App install ho gaya ✔ — ab home screen se kholo');
});
function isIOSDevice() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isInAppBrowser() { const ua = navigator.userAgent || ''; return /; wv\)|FBAN|FBAV|Instagram|WhatsApp|Line\/|Snapchat/i.test(ua); }
async function installApp() {
  if (isStandaloneDisplay()) { toast('App pehle se install hai ✔'); return; }
  if (DEFERRED_INSTALL_PROMPT) {
    // Android / Desktop Chrome: seedha ek tap mein install
    DEFERRED_INSTALL_PROMPT.prompt();
    const choice = await DEFERRED_INSTALL_PROMPT.userChoice;
    DEFERRED_INSTALL_PROMPT = null;
    updateInstallButtonVisibility();
    toast(choice.outcome === 'accepted' ? 'App install ho raha hai ✔' : 'Install cancel kiya');
    return;
  }
  const url = location.href.split('#')[0];
  if (isInAppBrowser()) {
    showModal(`
      <h3 style="font-size:16px;margin:0 0 10px;">📲 Pehle Chrome / Safari mein kholo</h3>
      <p style="color:var(--ink-soft);font-size:14px;margin:0 0 12px;">Aapne link WhatsApp / Instagram ke andar khola hai — inke andar app install nahi hota.</p>
      <ol style="padding-left:20px;font-size:14px;line-height:1.9;margin:0 0 12px;">
        <li>Upar <b>⋮</b> (ya <b>⋯</b>) dabao → <b>"Open in Chrome"</b> / <b>"Open in browser"</b></li>
        <li>Wahan phir se <b>📲 Install</b> dabao</li>
      </ol>
      <button class="btn btn-outline w-full" onclick="navigator.clipboard && navigator.clipboard.writeText('${url}').then(()=>toast('Link copy ho gaya — Chrome mein paste karo'))">🔗 Link copy karo</button>`);
    return;
  }
  if (isIOSDevice()) {
    const notSafari = /CriOS|FxiOS|EdgiOS/i.test(navigator.userAgent);
    showModal(`
      <h3 style="font-size:16px;margin:0 0 6px;">📲 iPhone / iPad par install</h3>
      <p style="color:var(--ink-soft);font-size:13px;margin:0 0 12px;">Apple kisi bhi website ko ek tap mein install nahi karne deta — bas 3 steps, sirf <b>ek baar</b>:</p>
      <ol style="padding-left:20px;font-size:14.5px;line-height:2;margin:0;">
        ${notSafari ? '<li>Ye link <b>Safari</b> mein kholo (Chrome mein bhi chalta hai, par Safari sabse sahi).</li>' : ''}
        <li>Neeche <b>Share</b> button dabao <span style="display:inline-block;border:1.5px solid var(--ink-soft);border-radius:5px;padding:0 6px;">⬆︎</span></li>
        <li>Thoda neeche scroll karke <b>"Add to Home Screen"</b> <span style="display:inline-block;border:1.5px solid var(--ink-soft);border-radius:5px;padding:0 5px;">＋</span> dabao</li>
        <li>Upar right mein <b>Add</b> dabao ✔</li>
      </ol>
      <p style="font-size:12.5px;color:var(--green);font-weight:600;margin:12px 0 0;">Iske baad home screen par P Food'z Cafe ka icon aa jayega — app jaisa full screen khulega, baar-baar karne ki zaroorat nahi.</p>`);
    return;
  }
  showModal(`
    <h3 style="font-size:16px;margin:0 0 10px;">📲 App Install karo</h3>
    <p style="color:var(--ink-soft);font-size:13px;margin:0 0 12px;">Chrome ne abhi one-tap install ka button nahi diya (pehli baar page khulne par kabhi kabhi kuch second lagte hain, ya pehle "Cancel" dabaya ho to Chrome kuch din tak nahi poochta). Ye tareeka hamesha chalta hai:</p>
    <ol style="padding-left:20px;font-size:14.5px;line-height:2;margin:0;">
      <li><b>Android Chrome:</b> upar right <b>⋮</b> dabao → <b>"Install app"</b> (ya "Add to Home screen") → <b>Install</b></li>
      <li><b>Computer (Chrome / Edge):</b> address bar ke right mein install icon <b>⊕</b> dabao</li>
    </ol>`);
}
function updateInstallButtonVisibility() {
  // Installed app ke andar button chhupa do; baaki har jagah dikhao (installApp har case sambhalta hai)
  const show = !isStandaloneDisplay();
  const a = document.getElementById('installAppBtn'); if (a) a.style.display = show ? 'flex' : 'none';
  const b = document.getElementById('installAppBtnLogin'); if (b) { b.style.display = show ? 'flex' : 'none'; b.textContent = DEFERRED_INSTALL_PROMPT ? '📲 App Install karo — ek tap' : '📲 App Install karo (phone par)'; }
}
updateInstallButtonVisibility();

/* ================================================================
   BOOT
   ================================================================ */
(function boot() {
  updateNetBadge();
  const saved = localStorage.getItem('pfp_user');
  if (saved) {
    STATE.user = JSON.parse(saved);
    if (!STATE.user || !STATE.user.token) { localStorage.removeItem('pfp_user'); STATE.user = null; const e = document.getElementById('loginErr'); if (e) { e.textContent = '🔐 App update hua hai — ek baar dobara login karo.'; e.style.display = 'block'; } }
    else enterApp();
  }
  if (getQueue().length) setQueue(getQueue());
  setInterval(syncQueue, 20000);
  document.getElementById('loginPass')?.addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
})();
</script>
</body>
</html>
